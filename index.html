<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>MELEC — Suivi Pédagogique v9</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d1117;--bg2:#161b24;--bg3:#1e2635;--bg4:#242f42;
  --border:#2a3347;--border2:#3a4a66;
  --accent:#3b82f6;--accent2:#60a5fa;
  --green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#a78bfa;--teal:#2dd4bf;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
  --header-h:52px;--tab-h:44px;
  --sidebar-w:200px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;flex-direction:column;}

/* ══ HEADER ══════════════════════════════════════════ */
#header{
  height:var(--header-h);flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  z-index:50;
}
.logo{font-family:var(--display);font-weight:800;font-size:16px;color:var(--accent2);letter-spacing:.04em;white-space:nowrap;}
.logo small{color:var(--text3);font-size:11px;font-weight:600;margin-left:6px;}

/* sélecteur de classe */
.classe-pills{display:flex;gap:3px;margin-left:12px;}
.cp{
  padding:4px 12px;border-radius:16px;font-size:12px;font-weight:600;
  cursor:pointer;border:1.5px solid var(--border);color:var(--text2);
  background:transparent;font-family:var(--sans);transition:all .15s;white-space:nowrap;
}
.cp:hover{border-color:var(--accent2);color:var(--accent2);}
.cp.on{background:var(--accent);border-color:var(--accent);color:#fff;}

.hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);flex-shrink:0;}
.sync-dot.ok{background:var(--green);}
.sync-dot.err{background:var(--red);}
.sync-dot.spin{background:var(--orange);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-lbl{font-size:11px;font-family:var(--mono);color:var(--text3);}

.ens-badge{
  display:flex;align-items:center;gap:6px;padding:4px 10px;
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  font-size:12px;cursor:pointer;transition:all .15s;
}
.ens-badge:hover{border-color:var(--accent);}
.ens-badge .ens-name{font-weight:600;color:var(--text);}
.ens-badge .ens-lock{color:var(--text3);font-size:13px;}

.btn{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;font-family:var(--sans);transition:all .15s;}
.btn-p{background:var(--accent);color:#fff;}.btn-p:hover{background:#2563eb;}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}.btn-g:hover{background:var(--bg3);color:var(--text);}
.btn-d{background:transparent;color:var(--red);border:1px solid #3f1a1a;}.btn-d:hover{background:#1f0a0a;}
.btn-sm{padding:3px 8px;font-size:11px;}
.btn-t{background:var(--teal);color:#111;}.btn-t:hover{background:#14b8a6;}
.btn-o{background:var(--orange);color:#111;}.btn-o:hover{background:#d97706;}

/* ══ ONGLETS PRINCIPAUX ══════════════════════════════ */
#tabs{
  height:var(--tab-h);flex-shrink:0;
  background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;padding:0 8px;gap:2px;
}
.tab{
  padding:0 16px;display:flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;cursor:pointer;color:var(--text2);
  border:none;background:none;border-bottom:2px solid transparent;
  font-family:var(--sans);transition:all .15s;white-space:nowrap;
}
.tab:hover{color:var(--text);}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent);}
.tab .ticon{font-size:15px;}

/* ══ BODY : SIDEBAR + CONTENT ═══════════════════════ */
#body{flex:1;display:flex;overflow:hidden;min-height:0;}

/* SIDEBAR CONTEXTUELLE */
#sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sb-section{padding:10px 8px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);}
.sb-item{
  display:flex;align-items:center;gap:8px;padding:8px 12px;
  border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);
  border:1px solid transparent;margin:1px 5px;transition:all .12s;
}
.sb-item:hover{background:var(--bg3);color:var(--text);}
.sb-item.on{background:#1a2540;border-color:var(--accent);color:var(--accent2);}
.sb-item .ico{font-size:15px;flex-shrink:0;}
.sb-item .badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:var(--bg3);padding:1px 5px;border-radius:3px;color:var(--text3);}
.sb-divider{height:1px;background:var(--border);margin:6px 12px;}

/* CONTENT */
#content{
  flex:1;overflow-y:auto;padding:20px;min-height:0;
  display:flex;flex-direction:column;gap:0;
}

/* ══ COMPOSANTS UI ═══════════════════════════════════ */
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;flex-wrap:wrap;
}
.page-title{font-family:var(--display);font-size:20px;font-weight:800;color:var(--text);}
.page-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.page-actions{display:flex;gap:7px;flex-wrap:wrap;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.card-head{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3);}
.card-title{font-family:var(--display);font-size:12px;font-weight:700;color:var(--text);flex:1;}
.card-body{padding:15px;}

/* STATS PILLS */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 16px;min-width:80px;text-align:center;}
.stat-v{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent2);}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}

/* TABLEAU */
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--bg3);color:var(--text2);font-weight:600;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}
.td-mono{font-family:var(--mono);font-size:11px;color:var(--text2);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;font-family:var(--mono);}
.b-green{background:#14231a;color:var(--green);border:1px solid #1a3a26;}
.b-orange{background:#251a0a;color:var(--orange);border:1px solid #3a2810;}
.b-red{background:#1f0a0a;color:var(--red);border:1px solid #3f1a1a;}
.b-blue{background:#111f3a;color:var(--accent2);border:1px solid #1a3060;}
.b-purple{background:#1e1632;color:var(--purple);border:1px solid #2e2048;}
.b-gray{background:var(--bg3);color:var(--text3);border:1px solid var(--border);}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.fg label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);}
input[type=text],input[type=password],input[type=date],input[type=email],input[type=tel],input[type=number],select,textarea{
  background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:8px 11px;color:var(--text);font-size:12px;font-family:var(--sans);
  transition:border-color .15s;width:100%;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
textarea{resize:vertical;min-height:70px;}
select option{background:var(--bg2);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;}
.full{grid-column:1/-1;}
.hint{font-size:10px;color:var(--text3);margin-top:3px;}
.fe{display:flex;justify-content:flex-end;gap:7px;margin-top:12px;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-ov.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:520px;max-width:100%;max-height:90vh;overflow-y:auto;padding:22px;}
.modal-title{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-foot{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;}

/* PRÉSENCE */
.pres-grid{display:flex;flex-wrap:wrap;gap:6px;}
.pres-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;min-width:140px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pres-name{font-size:12px;font-weight:500;}
.pres-btns{display:flex;gap:4px;}
.pres-btn{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .12s;}
.pres-btn.P.on{background:#14231a;border-color:var(--green);color:var(--green);}
.pres-btn.A.on{background:#1f0a0a;border-color:var(--red);color:var(--red);}
.pres-btn.R.on{background:#251a0a;border-color:var(--orange);color:var(--orange);}
.pres-btn:not(.on){color:var(--text3);}
.pres-btn:hover{border-color:var(--accent2);}

/* HABILITATIONS */
.hab-table{width:100%;}
.hab-table th{background:var(--bg3);}
.hab-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;margin:auto;display:block;transition:all .12s;}
.hab-dot.ok{background:var(--green);border-color:var(--green);}
.hab-dot.nok{background:transparent;}
.hab-dot:hover{border-color:var(--accent2);}

/* DASHBOARD CARDS */
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.dash-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;}
.dash-card:hover{border-color:var(--accent);transform:translateY(-1px);}
.dash-card.on{border-color:var(--accent);background:#111f3a;}
.dash-card-title{font-family:var(--display);font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;}
.dash-stats{display:flex;gap:10px;flex-wrap:wrap;}
.ds{text-align:center;}
.ds-v{font-family:var(--display);font-size:20px;font-weight:800;color:var(--accent2);}
.ds-l{font-size:10px;color:var(--text3);text-transform:uppercase;}

/* TP ASSIGNATION */
.tp-assign-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:7px;margin-bottom:5px;}
.tpar-info{flex:1;min-width:0;}
.tpar-title{font-size:13px;font-weight:500;}
.tpar-meta{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:2px;}
.tpar-actions{display:flex;gap:5px;flex-shrink:0;}

/* EVAL COULEURS */
.eval-dot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0;display:inline-block;}
.eval-dot:hover{transform:scale(1.2);}
.eval-dot.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3);}
.eval-dot.bleu{background:#3b82f6;}
.eval-dot.rouge{background:#ef4444;}
.eval-dot.orange{background:#f59e0b;}
.eval-dot.vclair{background:#86efac;}
.eval-dot.vfonce{background:#16a34a;}

/* EMPTY STATE */
.empty{padding:40px;text-align:center;color:var(--text3);}
.empty .ei{font-size:36px;margin-bottom:10px;opacity:.4;}
.empty .et{font-size:13px;}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;background:var(--bg3);border-radius:8px;padding:10px 16px;font-size:12px;z-index:999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.4);border:1px solid var(--border);}
#toast.show{display:block;}
#toast.ok{border-color:var(--green);}
#toast.err{border-color:var(--red);}

/* MOBILE */
@media(max-width:700px){
  #sidebar{display:none;}
  #content{padding:12px;}
  .dash-grid{grid-template-columns:1fr;}
  .frow,.frow3{grid-template-columns:1fr;}
  .modal{border-radius:12px 12px 0 0;position:fixed;bottom:0;left:0;right:0;width:100%;max-height:85vh;}
  .modal-ov{align-items:flex-end;}
  .tab .tlabel{display:none;}
  .tab{padding:0 10px;}
  .cp{padding:3px 8px;font-size:11px;}
}

::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="logo">⚡MELEC<small>Suivi v9</small></div>
  <div class="classe-pills">
    <button class="cp on" onclick="setClasse('2MELEC',this)">2nde</button>
    <button class="cp" onclick="setClasse('1MELEC',this)">1ère</button>
    <button class="cp" onclick="setClasse('T-MELEC',this)">Term.</button>
  </div>
  <div class="hright">
    <div class="sync-dot" id="sync-dot"></div>
    <span class="sync-lbl" id="sync-lbl">—</span>
    <button class="btn btn-g btn-sm" onclick="saveAll()">↑ Sauvegarder</button>
    <div class="ens-badge" onclick="openModal('modal-login')">
      <span class="ens-lock">🔒</span>
      <span class="ens-name" id="ens-name">Se connecter</span>
    </div>
  </div>
</div>

<!-- ONGLETS PRINCIPAUX -->
<div id="tabs">
  <button class="tab on" onclick="switchTab('quotidien',this)"><span class="ticon">📅</span><span class="tlabel">Quotidien</span></button>
  <button class="tab" onclick="switchTab('eleves',this)"><span class="ticon">👥</span><span class="tlabel">Élèves</span></button>
  <button class="tab" onclick="switchTab('activites',this)"><span class="ticon">🔬</span><span class="tlabel">Activités</span></button>
  <button class="tab" onclick="switchTab('config',this)"><span class="ticon">⚙️</span><span class="tlabel">Config</span></button>
</div>

<!-- BODY -->
<div id="body">
  <div id="sidebar"></div>
  <div id="content">
    <div class="empty"><div class="ei">⚡</div><div class="et">Chargement...</div></div>
  </div>
</div>

<!-- MODALES -->
<div class="modal-ov" id="modal-login">
  <div class="modal">
    <div class="modal-title">🔐 Identification enseignant</div>
    <div class="fg"><label>Enseignant</label>
      <select id="login-ens"></select>
    </div>
    <div class="fg"><label>Mot de passe</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div style="font-size:11px;color:var(--red);margin-top:4px;display:none;" id="login-err">Mot de passe incorrect</div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-login')">Annuler</button>
      <button class="btn btn-p" onclick="doLogin()">Valider</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-eleve">
  <div class="modal">
    <div class="modal-title" id="modal-eleve-title">👤 Élève</div>
    <div class="frow">
      <div class="fg"><label>NOM *</label><input type="text" id="el-nom" placeholder="Majuscules"></div>
      <div class="fg"><label>Prénom *</label><input type="text" id="el-prenom"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Classe *</label>
        <select id="el-classe">
          <option value="2MELEC">2nde MELEC</option>
          <option value="1MELEC">1ère MELEC</option>
          <option value="T-MELEC">Terminale MELEC</option>
        </select>
      </div>
      <div class="fg"><label>Date naissance (JJMMAAAA)</label><input type="text" id="el-ddn" placeholder="01012009"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Téléphone</label><input type="tel" id="el-tel"></div>
      <div class="fg"><label>Email</label><input type="email" id="el-mail"></div>
    </div>
    <div class="fg"><label>Mot de passe élève</label><input type="text" id="el-pass" placeholder="Laisser vide pour auto-générer"></div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-eleve')">Annuler</button>
      <button class="btn btn-p" onclick="saveEleve()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-appel">
  <div class="modal" style="width:600px;">
    <div class="modal-title">📋 Feuille d'appel</div>
    <div class="frow" style="margin-bottom:12px;">
      <div class="fg"><label>Date *</label><input type="date" id="appel-date"></div>
      <div class="fg"><label>Classe</label>
        <select id="appel-classe">
          <option value="2MELEC">2nde MELEC</option>
          <option value="1MELEC">1ère MELEC</option>
          <option value="T-MELEC">Terminale MELEC</option>
        </select>
      </div>
    </div>
    <div id="appel-eleves" class="pres-grid" style="margin-bottom:12px;"></div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-appel')">Annuler</button>
      <button class="btn btn-p" onclick="saveAppel()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-note">
  <div class="modal">
    <div class="modal-title">🗒️ Interrogation</div>
    <div class="fg"><label>Intitulé *</label><input type="text" id="note-title" placeholder="ex: Interro SA + ECS"></div>
    <div class="frow">
      <div class="fg"><label>Date</label><input type="date" id="note-date"></div>
      <div class="fg"><label>Classe</label>
        <select id="note-classe">
          <option value="2MELEC">2nde MELEC</option>
          <option value="1MELEC">1ère MELEC</option>
          <option value="T-MELEC">Terminale MELEC</option>
        </select>
      </div>
    </div>
    <div id="note-eleves-fields" style="margin-top:10px;display:flex;flex-direction:column;gap:6px;"></div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-note')">Annuler</button>
      <button class="btn btn-p" onclick="saveNote()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-pfmp">
  <div class="modal">
    <div class="modal-title">🏭 PFMP — Stage</div>
    <div class="fg"><label>Élève *</label><select id="pfmp-eleve"></select></div>
    <div class="frow">
      <div class="fg"><label>Session N°</label><input type="text" id="pfmp-session" placeholder="1, 2..."></div>
      <div class="fg"><label>Entreprise *</label><input type="text" id="pfmp-ent"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Début *</label><input type="date" id="pfmp-debut"></div>
      <div class="fg"><label>Fin *</label><input type="date" id="pfmp-fin"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Tuteur</label><input type="text" id="pfmp-tuteur"></div>
      <div class="fg"><label>Tél. tuteur</label><input type="tel" id="pfmp-tuttel"></div>
    </div>
    <div class="fg full"><label>Commentaire</label><textarea id="pfmp-comment"></textarea></div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-pfmp')">Annuler</button>
      <button class="btn btn-p" onclick="savePFMP()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-assign-tp">
  <div class="modal" style="width:580px;">
    <div class="modal-title">🔬 Assigner un TP</div>
    <div class="fg"><label>TP (depuis la bibliothèque)</label>
      <select id="assign-tp-id">
        <option value="">Chargement...</option>
      </select>
    </div>
    <div class="fg"><label>Classe</label>
      <select id="assign-classe" onchange="refreshAssignEleves()">
        <option value="2MELEC">2nde MELEC</option>
        <option value="1MELEC">1ère MELEC</option>
        <option value="T-MELEC">Terminale MELEC</option>
      </select>
    </div>
    <div class="fg"><label>Élève(s)</label>
      <div id="assign-eleves" style="display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto;"></div>
    </div>
    <div class="frow">
      <div class="fg"><label>Date</label><input type="date" id="assign-date"></div>
      <div class="fg"><label>Nb séances prévues</label><input type="number" id="assign-seances" value="2" min="1" max="20"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-assign-tp')">Annuler</button>
      <button class="btn btn-p" onclick="saveAssignTP()">Assigner</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="modal-confirm">
  <div class="modal" style="max-width:400px;">
    <div class="modal-title" id="confirm-title">Confirmer</div>
    <div id="confirm-body" style="font-size:13px;color:var(--text2);margin-bottom:14px;"></div>
    <div class="fg" id="confirm-input-wrap" style="display:none;">
      <label id="confirm-input-label">Saisissez la confirmation</label>
      <input type="text" id="confirm-input">
    </div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-confirm')">Annuler</button>
      <button class="btn btn-d" id="confirm-ok-btn" onclick="confirmAction()">Confirmer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
// CONSTANTES
// ════════════════════════════════════════════════════════════
const CLASSES = { '2MELEC':'2nde MELEC', '1MELEC':'1ère MELEC', 'T-MELEC':'Terminale MELEC' };
const PRESENCES = { P:'P', A:'A', R:'R' };
const HAB_TYPES = ['B0','B1V','BR'];

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
let cfg = {
  token: '',
  dataGistId: '',   // gist melec-data (nouveaux fichiers séparés)
  tpGistId: '',     // gist tp-admin (tps.json, ressources.json)
  appUrl: ''
};
let state = {
  classe: '2MELEC',
  tab: 'quotidien',
  section: '',
  enseignant: null,
};
let data = {
  eleves: [],
  teachers: [],
  appel: [],
  habilitations: {},
  pfmp: [],
  notes: {},       // notesEns par teacherId
  bons: [],
  cours: [],
  // depuis tp-admin gist
  tps: [],
  sessions: [],    // tp-sessions.json
};
let confirmCb = null;
let editCtx = {}; // contexte d'édition en cours

// ════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════
function init() {
  const c = localStorage.getItem('melec_suivi_cfg');
  if (c) cfg = Object.assign(cfg, JSON.parse(c));
  loadLocal();
  if (cfg.token && cfg.dataGistId) loadRemote();
  else { setSyncState('err','Config manquante'); }
  switchTab('quotidien', document.querySelector('.tab.on'));
  setClasse('2MELEC', document.querySelector('.cp.on'));
  prefillForms();
}

function loadLocal() {
  try { data.eleves     = JSON.parse(localStorage.getItem('ml_eleves')  || '[]'); } catch(e){}
  try { data.teachers   = JSON.parse(localStorage.getItem('ml_teachers')|| '[]'); } catch(e){}
  try { data.appel      = JSON.parse(localStorage.getItem('ml_appel')   || '[]'); } catch(e){}
  try { data.habilitations = JSON.parse(localStorage.getItem('ml_hab')  || '{}'); } catch(e){}
  try { data.pfmp       = JSON.parse(localStorage.getItem('ml_pfmp')    || '[]'); } catch(e){}
  try { data.notes      = JSON.parse(localStorage.getItem('ml_notes')   || '{}'); } catch(e){}
  try { data.bons       = JSON.parse(localStorage.getItem('ml_bons')    || '[]'); } catch(e){}
  try { data.cours      = JSON.parse(localStorage.getItem('ml_cours')   || '[]'); } catch(e){}
  try { data.tps        = JSON.parse(localStorage.getItem('ml_tps')     || '[]'); } catch(e){}
  try { data.sessions   = JSON.parse(localStorage.getItem('ml_sessions')|| '[]'); } catch(e){}
}

function saveLocal() {
  localStorage.setItem('ml_eleves',   JSON.stringify(data.eleves));
  localStorage.setItem('ml_teachers', JSON.stringify(data.teachers));
  localStorage.setItem('ml_appel',    JSON.stringify(data.appel));
  localStorage.setItem('ml_hab',      JSON.stringify(data.habilitations));
  localStorage.setItem('ml_pfmp',     JSON.stringify(data.pfmp));
  localStorage.setItem('ml_notes',    JSON.stringify(data.notes));
  localStorage.setItem('ml_bons',     JSON.stringify(data.bons));
  localStorage.setItem('ml_cours',    JSON.stringify(data.cours));
  localStorage.setItem('ml_tps',      JSON.stringify(data.tps));
  localStorage.setItem('ml_sessions', JSON.stringify(data.sessions));
}

// ════════════════════════════════════════════════════════════
// GIST — CHARGEMENT
// ════════════════════════════════════════════════════════════
async function loadRemote() {
  setSyncState('spin','Chargement...');
  try {
    const h = { Authorization:`token ${cfg.token}`, 'X-GitHub-Api-Version':'2022-11-28' };

    // Charger le Gist de données principal
    const r1 = await fetch(`https://api.github.com/gists/${cfg.dataGistId}`, { headers:h });
    if (!r1.ok) throw new Error('HTTP '+r1.status);
    const g1 = await r1.json();

    const load = (fname, fallback) => {
      const f = g1.files[fname];
      if (!f) return fallback;
      try { return JSON.parse(f.content); } catch(e) { return fallback; }
    };

    data.eleves        = load('eleves.json', []);
    data.teachers      = load('teachers.json', []);
    data.appel         = load('appel.json', []);
    data.habilitations = load('habilitations.json', {});
    data.pfmp          = load('pfmp.json', []);
    data.notes         = load('notes.json', {});
    data.bons          = load('bons-intervention.json', []);
    data.cours         = load('cours.json', []);

    // Charger le Gist tp-admin si configuré
    if (cfg.tpGistId) {
      const r2 = await fetch(`https://api.github.com/gists/${cfg.tpGistId}`, { headers:h });
      if (r2.ok) {
        const g2 = await r2.json();
        data.tps      = g2.files['tps.json']      ? JSON.parse(g2.files['tps.json'].content)      : [];
        data.sessions = g2.files['tp-sessions.json'] ? JSON.parse(g2.files['tp-sessions.json'].content) : [];
      }
    }

    saveLocal();
    setSyncState('ok','Synchronisé');
    render();
    toast('Données chargées','ok');
  } catch(e) {
    setSyncState('err', e.message.substring(0,30));
    toast('Erreur : '+e.message,'err');
    render();
  }
}

async function saveAll() {
  if (!cfg.token || !cfg.dataGistId) { toast('Configurez le Gist (Config)','err'); return; }
  setSyncState('spin','Sauvegarde...');
  try {
    const h = { Authorization:`token ${cfg.token}`, 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2022-11-28' };
    await fetch(`https://api.github.com/gists/${cfg.dataGistId}`, {
      method:'PATCH', headers:h,
      body: JSON.stringify({ files:{
        'eleves.json':           { content: JSON.stringify(data.eleves,null,2) },
        'teachers.json':         { content: JSON.stringify(data.teachers,null,2) },
        'appel.json':            { content: JSON.stringify(data.appel,null,2) },
        'habilitations.json':    { content: JSON.stringify(data.habilitations,null,2) },
        'pfmp.json':             { content: JSON.stringify(data.pfmp,null,2) },
        'notes.json':            { content: JSON.stringify(data.notes,null,2) },
        'bons-intervention.json':{ content: JSON.stringify(data.bons,null,2) },
        'cours.json':            { content: JSON.stringify(data.cours,null,2) },
      }})
    });
    // Sauver sessions dans gist tp-admin
    if (cfg.tpGistId && data.sessions.length) {
      await fetch(`https://api.github.com/gists/${cfg.tpGistId}`, {
        method:'PATCH', headers:h,
        body: JSON.stringify({ files:{ 'tp-sessions.json':{ content: JSON.stringify(data.sessions,null,2) } }})
      });
    }
    setSyncState('ok','Sauvegardé');
    saveLocal();
    toast('Sauvegardé sur GitHub ✓','ok');
  } catch(e) { setSyncState('err','Err.sync'); toast('Erreur : '+e.message,'err'); }
}

function setSyncState(cls,msg) {
  const d = document.getElementById('sync-dot');
  const l = document.getElementById('sync-lbl');
  d.className = 'sync-dot '+(cls==='spin'?'spin':cls==='ok'?'ok':'err');
  l.textContent = msg;
}

// ════════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════════
function setClasse(cl, btn) {
  state.classe = cl;
  document.querySelectorAll('.cp').forEach(b=>b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  render();
}

function switchTab(tab, btn) {
  state.tab = tab;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  // section par défaut de chaque onglet
  const defaults = { quotidien:'dashboard', eleves:'fiches', activites:'tps', config:'gists' };
  state.section = defaults[tab] || '';
  renderSidebar();
  render();
}

function setSection(s) {
  state.section = s;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('on', el.dataset.s===s));
  render();
}

// ════════════════════════════════════════════════════════════
// SIDEBAR
// ════════════════════════════════════════════════════════════
const SIDEBAR_DEFS = {
  quotidien: [
    { s:'dashboard', ico:'🏠', label:'Tableau de bord' },
    { s:'appel',     ico:'📋', label:'Appel', badge:()=>data.appel.filter(a=>a.level===state.classe).length },
    { s:'notes',     ico:'🗒️', label:'Notes', badge:()=>Object.values(data.notes).reduce((a,arr)=>a+(arr||[]).filter(n=>n.level===state.classe).length,0) },
  ],
  eleves: [
    { s:'fiches',    ico:'👤', label:'Fiches élèves', badge:()=>elevesByClasse().length },
    { s:'pfmp',      ico:'🏭', label:'PFMP / Stages', badge:()=>data.pfmp.filter(p=>elevesByClasse().some(e=>e.id===p.eleveId)).length },
    { s:'hab',       ico:'⚡', label:'Habilitations' },
  ],
  activites: [
    { s:'tps',       ico:'🔬', label:'TPs', badge:()=>sessionsByClasse().length },
    { s:'cours',     ico:'📖', label:'Cours', badge:()=>data.cours.filter(c=>c.level===state.classe).length },
    { s:'bons',      ico:'📋', label:'Bons d\'intervention', badge:()=>data.bons.filter(b=>b.eleveLevel===state.classe).length },
  ],
  config: [
    { s:'gists',     ico:'🔗', label:'Connexion Gist' },
    { s:'teachers',  ico:'👨‍🏫', label:'Enseignants' },
    { s:'export',    ico:'💾', label:'Export / Import' },
    { s:'annee',     ico:'🎓', label:'Fin d\'année' },
  ],
};

function renderSidebar() {
  const items = SIDEBAR_DEFS[state.tab] || [];
  document.getElementById('sidebar').innerHTML = items.map(it=>{
    const b = it.badge ? it.badge() : null;
    return `<div class="sb-item${state.section===it.s?' on':''}" data-s="${it.s}" onclick="setSection('${it.s}')">
      <span class="ico">${it.ico}</span>${it.label}
      ${b!==null?`<span class="badge">${b}</span>`:''}
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════
// RENDER PRINCIPAL
// ════════════════════════════════════════════════════════════
function render() {
  renderSidebar();
  const fn = {
    dashboard:  renderDashboard,
    appel:      renderAppel,
    notes:      renderNotes,
    fiches:     renderFiches,
    pfmp:       renderPFMP,
    hab:        renderHab,
    tps:        renderTPs,
    cours:      renderCours,
    bons:       renderBons,
    gists:      renderConfig,
    teachers:   renderTeachers,
    export:     renderExport,
    annee:      renderAnnee,
  }[state.section];
  if (fn) fn();
}

// ════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════
function elevesByClasse(cl) { return data.eleves.filter(e=>e.classe===(cl||state.classe)); }
function sessionsByClasse() { return data.sessions.filter(s=>s.classe===state.classe); }
function genId(pfx) { return pfx+Date.now().toString(36).toUpperCase(); }
function esc(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function classeLabel(c) { return CLASSES[c]||c; }
function enseignantNom(id) { const e=data.teachers.find(t=>t.id===id); return e?e.nom:'—'; }
function eleveNom(id) { const e=data.eleves.find(x=>x.id===id); return e?e.nom+' '+e.prenom:'?'; }
function today() { return new Date().toISOString().slice(0,10); }

function setContent(html) { document.getElementById('content').innerHTML = html; }

function pageHeader(title, sub, actions='') {
  return `<div class="page-header">
    <div><div class="page-title">${title}</div>${sub?`<div class="page-sub">${sub}</div>`:''}
    </div><div class="page-actions">${actions}</div>
  </div>`;
}

// ════════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════════
function renderDashboard() {
  const cards = Object.entries(CLASSES).map(([cl,lbl])=>{
    const elv = elevesByClasse(cl).length;
    const ses = data.sessions.filter(s=>s.classe===cl).length;
    const dernierAppel = data.appel.filter(a=>a.level===cl).sort((a,b)=>b.date.localeCompare(a.date))[0];
    return `<div class="dash-card${cl===state.classe?' on':''}" onclick="setClasse('${cl}',null);document.querySelectorAll('.cp').forEach((b,i)=>{b.classList.toggle('on',['2MELEC','1MELEC','T-MELEC'][i]==='${cl}')}); render()">
      <div class="dash-card-title">${lbl}</div>
      <div class="dash-stats">
        <div class="ds"><div class="ds-v">${elv}</div><div class="ds-l">Élèves</div></div>
        <div class="ds"><div class="ds-v">${ses}</div><div class="ds-l">TPs en cours</div></div>
        <div class="ds"><div class="ds-v">${dernierAppel?dernierAppel.date.slice(5).replace('-','/'):'—'}</div><div class="ds-l">Dernier appel</div></div>
      </div>
    </div>`;
  }).join('');

  const cl = state.classe;
  const elv = elevesByClasse();
  const sessions = sessionsByClasse();
  const appels = data.appel.filter(a=>a.level===cl).sort((a,b)=>b.date.localeCompare(a.date));
  const dernierAppel = appels[0];

  let presenceRow = '';
  if (dernierAppel) {
    const pres = Object.entries(dernierAppel.presences||{});
    const P = pres.filter(([,v])=>v==='P').length;
    const A = pres.filter(([,v])=>v==='A').length;
    const R = pres.filter(([,v])=>v==='R').length;
    presenceRow = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">
      <span class="badge b-green">✓ ${P} présents</span>
      <span class="badge b-red">✕ ${A} absents</span>
      ${R?`<span class="badge b-orange">↩ ${R} retards</span>`:''}
      <span class="badge b-gray">${dernierAppel.date}</span>
    </div>`;
  }

  setContent(`
    ${pageHeader('Tableau de bord', `Vue d'ensemble — ${classeLabel(cl)}`)}
    <div class="dash-grid">${cards}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="card">
        <div class="card-head"><span>📋</span><span class="card-title">Dernier appel — ${classeLabel(cl)}</span>
          <button class="btn btn-g btn-sm" onclick="openAppelModal()">+ Nouvelle séance</button>
        </div>
        <div class="card-body">
          ${dernierAppel
            ? `<div style="font-size:12px;font-weight:600;">${dernierAppel.date} · ${enseignantNom(dernierAppel.teacherId)}</div>${presenceRow}`
            : '<div class="muted" style="font-size:12px;color:var(--text3);">Aucun appel enregistré</div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span>🔬</span><span class="card-title">TPs en cours — ${classeLabel(cl)}</span></div>
        <div class="card-body">
          ${sessions.length
            ? sessions.slice(0,4).map(s=>{
                const tp=data.tps.find(t=>t.id===s.tpId);
                return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <span style="font-size:12px;flex:1;">${esc(tp?tp.titre:s.tpId)}</span>
                  <span class="badge b-blue">${esc(eleveNom(s.eleveId))}</span>
                </div>`;
              }).join('')+(sessions.length>4?`<div style="font-size:11px;color:var(--text3);">+${sessions.length-4} autres...</div>`:'')
            : '<div class="muted" style="font-size:12px;color:var(--text3);">Aucun TP en cours</div>'}
        </div>
      </div>
    </div>
  `);
}

// ════════════════════════════════════════════════════════════
// APPEL
// ════════════════════════════════════════════════════════════
function renderAppel() {
  const cl = state.classe;
  const appels = data.appel.filter(a=>a.level===cl).sort((a,b)=>b.date.localeCompare(a.date));

  const rows = appels.map(a=>{
    const pres = Object.values(a.presences||{});
    const P = pres.filter(v=>v==='P').length;
    const A = pres.filter(v=>v==='A').length;
    const R = pres.filter(v=>v==='R').length;
    return `<tr>
      <td class="td-mono">${a.date}</td>
      <td>${esc(enseignantNom(a.teacherId))}</td>
      <td><span class="badge b-green">✓ ${P}</span></td>
      <td><span class="badge b-red">✕ ${A}</span></td>
      <td>${R?`<span class="badge b-orange">↩ ${R}</span>`:''}</td>
      <td><button class="btn btn-g btn-sm" onclick="showAppelDetail('${a.id}')">Voir</button>
          <button class="btn btn-d btn-sm" onclick="deleteAppel('${a.id}')">✕</button></td>
    </tr>`;
  }).join('');

  setContent(`
    ${pageHeader('Appel','Feuilles de présence — '+classeLabel(cl),
      `<button class="btn btn-p" onclick="openAppelModal()">+ Nouvelle séance</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${appels.length ? `<table>
          <thead><tr><th>Date</th><th>Enseignant</th><th>Présents</th><th>Absents</th><th>Retards</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">📋</div><div class="et">Aucune feuille d\'appel</div></div>'}
      </div>
    </div>
  `);
}

function openAppelModal() {
  const cl = state.classe;
  document.getElementById('appel-date').value = today();
  document.getElementById('appel-classe').value = cl;
  const elv = elevesByClasse(cl);
  document.getElementById('appel-eleves').innerHTML = elv.map(e=>`
    <div class="pres-card">
      <div class="pres-name">${esc(e.nom)} ${esc(e.prenom)}</div>
      <div class="pres-btns">
        <button class="pres-btn P" data-id="${e.id}" data-val="P" onclick="togglePres(this)">P</button>
        <button class="pres-btn A" data-id="${e.id}" data-val="A" onclick="togglePres(this)">A</button>
        <button class="pres-btn R" data-id="${e.id}" data-val="R" onclick="togglePres(this)">R</button>
      </div>
    </div>`).join('');
  openModal('modal-appel');
}

function togglePres(btn) {
  const id = btn.dataset.id;
  const val = btn.dataset.val;
  // retirer .on de tous les boutons du même élève
  btn.closest('.pres-card').querySelectorAll('.pres-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function saveAppel() {
  const date = document.getElementById('appel-date').value;
  const cl = document.getElementById('appel-classe').value;
  if (!date) { toast('Date requise','err'); return; }
  const presences = {};
  document.querySelectorAll('.pres-btn.on').forEach(btn=>{
    presences[btn.dataset.id] = btn.dataset.val;
  });
  const a = {
    id: genId('APP'),
    date, level: cl,
    teacherId: state.enseignant?.id || '',
    presences
  };
  data.appel.push(a);
  saveLocal(); closeModal('modal-appel'); render();
  toast('Appel enregistré','ok');
}

function deleteAppel(id) {
  askConfirm('Supprimer cette feuille d\'appel ?','',()=>{
    data.appel = data.appel.filter(a=>a.id!==id);
    saveLocal(); render(); toast('Supprimé','ok');
  });
}

function showAppelDetail(id) {
  const a = data.appel.find(x=>x.id===id); if(!a)return;
  const elv = elevesByClasse(a.level);
  const pmap = {P:'✓ Présent',A:'✕ Absent',R:'↩ Retard'};
  const bcls = {P:'b-green',A:'b-red',R:'b-orange'};
  const content = `<div style="font-family:var(--mono);font-size:11px;color:var(--text2);margin-bottom:12px;">${a.date} · ${classeLabel(a.level)} · ${enseignantNom(a.teacherId)}</div>
    <div style="display:flex;flex-direction:column;gap:5px;">
      ${elv.map(e=>{
        const p = a.presences?.[e.id]||'—';
        return `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:5px;">
          <span style="flex:1;font-size:12px;">${esc(e.nom)} ${esc(e.prenom)}</span>
          ${p!=='—'?`<span class="badge ${bcls[p]||'b-gray'}">${pmap[p]||p}</span>`:'<span class="badge b-gray">—</span>'}
        </div>`;
      }).join('')}
    </div>`;
  // popup simple dans la zone content
  document.getElementById('content').insertAdjacentHTML('afterbegin',`
    <div class="card" style="border-color:var(--accent2);margin-bottom:16px;">
      <div class="card-head"><span>📋</span><span class="card-title">Détail appel du ${a.date}</span>
        <button class="btn btn-g btn-sm" style="margin-left:auto" onclick="this.closest('.card').remove()">✕ Fermer</button>
      </div>
      <div class="card-body">${content}</div>
    </div>`);
}

// ════════════════════════════════════════════════════════════
// NOTES
// ════════════════════════════════════════════════════════════
function renderNotes() {
  const cl = state.classe;
  // notes est {teacherId: [{id,title,date,level,notes:{eleveId:val}}]}
  const allNotes = Object.entries(data.notes).flatMap(([tid,arr])=>
    (arr||[]).filter(n=>n.level===cl).map(n=>({...n,teacherId:tid}))
  ).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const elv = elevesByClasse();
  const rows = allNotes.map(n=>{
    const vals = Object.values(n.notes||{});
    const nums = vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v));
    const moy = nums.length ? (nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(1) : '—';
    return `<tr>
      <td>${esc(n.title)}</td>
      <td class="td-mono">${n.date||'—'}</td>
      <td>${esc(enseignantNom(n.teacherId))}</td>
      <td class="td-mono">${moy}</td>
      <td><button class="btn btn-g btn-sm" onclick="showNoteDetail('${n.id}','${n.teacherId}')">Voir</button>
          <button class="btn btn-d btn-sm" onclick="deleteNote('${n.id}','${n.teacherId}')">✕</button></td>
    </tr>`;
  }).join('');

  setContent(`
    ${pageHeader('Notes','Interrogations — '+classeLabel(cl),
      `<button class="btn btn-p" onclick="openNoteModal()">+ Nouvelle interro</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${allNotes.length ? `<table>
          <thead><tr><th>Intitulé</th><th>Date</th><th>Enseignant</th><th>Moyenne</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">🗒️</div><div class="et">Aucune interrogation</div></div>'}
      </div>
    </div>
  `);
}

function openNoteModal() {
  const cl = state.classe;
  document.getElementById('note-date').value = today();
  document.getElementById('note-classe').value = cl;
  document.getElementById('note-title').value = '';
  updateNoteElevesFields();
  openModal('modal-note');
}

function updateNoteElevesFields() {
  const cl = document.getElementById('note-classe').value || state.classe;
  const elv = elevesByClasse(cl);
  document.getElementById('note-eleves-fields').innerHTML = elv.map(e=>`
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="flex:1;font-size:12px;">${esc(e.nom)} ${esc(e.prenom)}</span>
      <input type="text" data-id="${e.id}" style="width:80px;" placeholder="note ou abs">
    </div>`).join('');
}

function saveNote() {
  const title = document.getElementById('note-title').value.trim();
  const cl    = document.getElementById('note-classe').value;
  const date  = document.getElementById('note-date').value;
  if (!title) { toast('Intitulé requis','err'); return; }
  const notes = {};
  document.querySelectorAll('#note-eleves-fields input[data-id]').forEach(inp=>{
    if (inp.value.trim()) notes[inp.dataset.id] = inp.value.trim();
  });
  const tid = state.enseignant?.id || 'T_inconnu';
  if (!data.notes[tid]) data.notes[tid] = [];
  data.notes[tid].push({ id:genId('NE'), title, date, level:cl, notes });
  saveLocal(); closeModal('modal-note'); render();
  toast('Interrogation enregistrée','ok');
}

function showNoteDetail(noteId, teacherId) {
  const arr = data.notes[teacherId]||[];
  const n = arr.find(x=>x.id===noteId); if(!n)return;
  const elv = elevesByClasse(n.level);
  const html = `<div style="display:flex;flex-direction:column;gap:5px;">
    ${elv.map(e=>{
      const val = n.notes?.[e.id]||'—';
      const num = parseFloat(val);
      const color = isNaN(num)?'b-gray':num>=10?'b-green':'b-red';
      return `<div style="display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:5px;">
        <span style="flex:1;font-size:12px;">${esc(e.nom)} ${esc(e.prenom)}</span>
        <span class="badge ${color}">${esc(val)}</span>
      </div>`;
    }).join('')}
  </div>`;
  document.getElementById('content').insertAdjacentHTML('afterbegin',`
    <div class="card" style="border-color:var(--accent2);margin-bottom:16px;">
      <div class="card-head"><span>🗒️</span><span class="card-title">${esc(n.title)} — ${n.date||'—'}</span>
        <button class="btn btn-g btn-sm" style="margin-left:auto" onclick="this.closest('.card').remove()">✕</button>
      </div><div class="card-body">${html}</div>
    </div>`);
}

function deleteNote(noteId, teacherId) {
  askConfirm('Supprimer cette interrogation ?','',()=>{
    if (data.notes[teacherId]) data.notes[teacherId] = data.notes[teacherId].filter(n=>n.id!==noteId);
    saveLocal(); render(); toast('Supprimée','ok');
  });
}

    <td class="td-mono">${e.ddn||'—'}</td>
    <td class="td-mono">${e.tel||'—'}</td>
    <td>${e.mail?`<a href="mailto:${esc(e.mail)}" style="color:var(--accent2);">${esc(e.mail)}</a>`:'—'}</td>
    <td>
      <button class="btn btn-g btn-sm" onclick="openEleveModal('${e.id}')">✏️</button>
      <button class="btn btn-d btn-sm" onclick="deleteEleve('${e.id}')">✕</button>
    </td>
  </tr>`).join('');

  setContent(`
    ${pageHeader('Élèves',classeLabel(state.classe)+' — '+elv.length+' élève'+( elv.length>1?'s':''),
      `<button class="btn btn-p" onclick="openEleveModal(null)">+ Ajouter</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${elv.length ? `<table>
          <thead><tr><th>Nom Prénom</th><th>Date naiss.</th><th>Téléphone</th><th>Email</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">👥</div><div class="et">Aucun élève dans cette classe</div></div>'}

  `);
}

function openEleveModal(id) {
  editCtx.eleveId = id;
  const e = id ? data.eleves.find(x=>x.id===id) : null;
  document.getElementById('modal-eleve-title').textContent = e ? '✏️ Modifier l\'élève' : '👤 Nouvel élève';
  document.getElementById('el-nom').value    = e?.nom||'';
  document.getElementById('el-prenom').value = e?.prenom||'';
  document.getElementById('el-classe').value = e?.classe||state.classe;
  document.getElementById('el-ddn').value    = e?.ddn||'';
  document.getElementById('el-tel').value    = e?.tel||'';
  document.getElementById('el-mail').value   = e?.mail||'';
  document.getElementById('el-pass').value   = '';
  openModal('modal-eleve');
}

function saveEleve() {
  const nom    = document.getElementById('el-nom').value.trim().toUpperCase();
  const prenom = document.getElementById('el-prenom').value.trim();
  const classe = document.getElementById('el-classe').value;
  if (!nom||!prenom) { toast('Nom et prénom requis','err'); return; }
  if (editCtx.eleveId) {
    const e = data.eleves.find(x=>x.id===editCtx.eleveId);
    if (e) { e.nom=nom; e.prenom=prenom; e.classe=classe;
      e.ddn=document.getElementById('el-ddn').value;
      e.tel=document.getElementById('el-tel').value;
      e.mail=document.getElementById('el-mail').value;
      const p=document.getElementById('el-pass').value;
      if(p)e.elevePass=hashSimple(p);
    }
  } else {
    const pass = document.getElementById('el-pass').value || (nom+prenom).toLowerCase().replace(/ /g,'');
    data.eleves.push({ id:genId('E'), nom, prenom, classe, ddn:document.getElementById('el-ddn').value,
      tel:document.getElementById('el-tel').value, mail:document.getElementById('el-mail').value,
      elevePass:hashSimple(pass) });
  }
  saveLocal(); closeModal('modal-eleve'); render();
  toast('Élève enregistré','ok');
}

function deleteEleve(id) {
  const e = data.eleves.find(x=>x.id===id);
  askConfirm(`Supprimer ${e?e.nom+' '+e.prenom:'cet élève'} ?`,'Les données associées (appel, PFMP...) seront conservées.',()=>{
    data.eleves = data.eleves.filter(x=>x.id!==id);
    saveLocal(); render(); toast('Élève supprimé','ok');
  });
}

function hashSimple(s) { let h=0; for(let c of String(s)){h=(h*31+c.charCodeAt(0))&0xffffffff;} return String(h); }

// PFMP
// ════════════════════════════════════════════════════════════
function renderPFMP() {
  const elv = elevesByClasse();
  const pfmps = data.pfmp.filter(p=>elv.some(e=>e.id===p.eleveId)).sort((a,b)=>b.debut.localeCompare(a.debut));
  const rows = pfmps.map(p=>{
    const e=data.eleves.find(x=>x.id===p.eleveId);
    return `<tr>
      <td><strong>${esc(e?e.nom:p.eleveId)}</strong> ${esc(e?.prenom||'')}</td>
      <td>${esc(p.session||'—')}</td>
      <td>${esc(p.entreprise||'—')}</td>
      <td class="td-mono">${p.debut||'—'} → ${p.fin||'—'}</td>
      <td>${esc(p.tuteur||'—')}</td>
      <td><button class="btn btn-g btn-sm" onclick="editPFMP('${p.id}')">✏️</button>
          <button class="btn btn-d btn-sm" onclick="deletePFMP('${p.id}')">✕</button></td>
    </tr>`;
  }).join('');

  setContent(`
    ${pageHeader('PFMP','Stages en entreprise — '+classeLabel(state.classe),
      `<button class="btn btn-p" onclick="openPFMPModal(null)">+ Nouvelle PFMP</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${pfmps.length ? `<table>
          <thead><tr><th>Élève</th><th>Session</th><th>Entreprise</th><th>Période</th><th>Tuteur</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">🏭</div><div class="et">Aucune PFMP</div></div>'}
      </div>
    </div>
  `);
}

function openPFMPModal(id) {
  editCtx.pfmpId = id;
  const p = id ? data.pfmp.find(x=>x.id===id) : null;
  const elv = elevesByClasse();
  const sel = document.getElementById('pfmp-eleve');
  sel.innerHTML = elv.map(e=>`<option value="${e.id}" ${p?.eleveId===e.id?'selected':''}>${esc(e.nom)} ${esc(e.prenom)}</option>`).join('');
  document.getElementById('pfmp-session').value = p?.session||'';
  document.getElementById('pfmp-ent').value     = p?.entreprise||'';
  document.getElementById('pfmp-debut').value   = p?.debut||'';
  document.getElementById('pfmp-fin').value     = p?.fin||'';
  document.getElementById('pfmp-tuteur').value  = p?.tuteur||'';
  document.getElementById('pfmp-tuttel').value  = p?.tuteurTel||'';
  document.getElementById('pfmp-comment').value = p?.comment||'';
  openModal('modal-pfmp');
}

function savePFMP() {
  const eleveId = document.getElementById('pfmp-eleve').value;
  const debut   = document.getElementById('pfmp-debut').value;
  const fin     = document.getElementById('pfmp-fin').value;
  const ent     = document.getElementById('pfmp-ent').value.trim();
  if (!eleveId||!debut||!ent) { toast('Élève, début et entreprise requis','err'); return; }
  const obj = { eleveId, session:document.getElementById('pfmp-session').value,
    entreprise:ent, debut, fin, tuteur:document.getElementById('pfmp-tuteur').value,
    tuteurTel:document.getElementById('pfmp-tuttel').value, comment:document.getElementById('pfmp-comment').value };
  if (editCtx.pfmpId) {
    const i=data.pfmp.findIndex(x=>x.id===editCtx.pfmpId);
    if(i>=0) data.pfmp[i]={...data.pfmp[i],...obj};
  } else { data.pfmp.push({id:genId('P'),...obj}); }
  saveLocal(); closeModal('modal-pfmp'); render(); toast('PFMP enregistrée','ok');
}

function editPFMP(id){openPFMPModal(id);}
function deletePFMP(id){askConfirm('Supprimer ce stage ?','',()=>{data.pfmp=data.pfmp.filter(x=>x.id!==id);saveLocal();render();toast('Supprimée','ok');});}

// ════════════════════════════════════════════════════════════
// HABILITATIONS
// ════════════════════════════════════════════════════════════
function renderHab() {
  const elv = elevesByClasse();
  const header = HAB_TYPES.map(h=>`<th colspan="2" style="text-align:center;">${h}</th>`).join('');
  const subheader = HAB_TYPES.map(()=>'<th style="font-size:9px;text-align:center;">Théo.</th><th style="font-size:9px;text-align:center;">Prat.</th>').join('');
  const rows = elv.map(e=>{
    const hab = data.habilitations[e.id]||{};
    const cells = HAB_TYPES.map(h=>{
      const theo = hab[h]?.theo||false;
      const prat = hab[h]?.prat||false;
      return `<td style="text-align:center;"><div class="hab-dot ${theo?'ok':'nok'}" onclick="toggleHab('${e.id}','${h}','theo')" title="${h} Théorique"></div></td>
              <td style="text-align:center;"><div class="hab-dot ${prat?'ok':'nok'}" onclick="toggleHab('${e.id}','${h}','prat')" title="${h} Pratique"></div></td>`;
    }).join('');
    return `<tr><td><strong>${esc(e.nom)}</strong> ${esc(e.prenom)}</td>${cells}</tr>`;
  }).join('');

  setContent(`
    ${pageHeader('Habilitations Électriques','B0 / B1V / BR — '+classeLabel(state.classe))}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${elv.length ? `<table class="hab-table">
          <thead><tr><th>Élève</th>${header}</tr><tr><th></th>${subheader}</tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">⚡</div><div class="et">Aucun élève</div></div>'}
      </div>
    </div>
    <div class="muted" style="margin-top:8px;">● Vert = validé &nbsp;○ Vide = non validé — Cliquer pour basculer</div>
  `);
}

function toggleHab(eleveId, type, field) {
  if (!data.habilitations[eleveId]) data.habilitations[eleveId]={};
  if (!data.habilitations[eleveId][type]) data.habilitations[eleveId][type]={theo:false,prat:false};
  data.habilitations[eleveId][type][field] = !data.habilitations[eleveId][type][field];
  saveLocal(); renderHab();
}

// ════════════════════════════════════════════════════════════
// TPs — ASSIGNATION
// ════════════════════════════════════════════════════════════
function renderTPs() {
  const cl = state.classe;
  const sessions = sessionsByClasse();
  const rows = sessions.map(s=>{
    const tp = data.tps.find(t=>t.id===s.tpId);
    const e  = data.eleves.find(x=>x.id===s.eleveId);
    const pct = s.seances>0 ? Math.round((s.seancesDone||0)/s.seances*100):0;
    return `<tr>
      <td><strong>${esc(tp?tp.titre:s.tpId)}</strong></td>
      <td>${esc(e?e.nom+' '+e.prenom:s.eleveId)}</td>
      <td class="td-mono">${s.date||'—'}</td>
      <td>
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;"></div>
          </div>
          <span style="font-size:10px;font-family:var(--mono);color:var(--text2);">${s.seancesDone||0}/${s.seances||'?'}</span>
        </div>
      </td>
      <td>
        ${s.statut==='termine'?'<span class="badge b-green">✓ Terminé</span>':
          s.statut==='en_cours'?'<span class="badge b-blue">En cours</span>':
          '<span class="badge b-gray">Assigné</span>'}
      </td>
      <td>
        <button class="btn btn-g btn-sm" onclick="addSeance('${s.id}')">+1 séance</button>
        <button class="btn btn-g btn-sm" onclick="toggleStatutTP('${s.id}')">
          ${s.statut==='termine'?'Rouvrir':'Terminer'}
        </button>
        <button class="btn btn-d btn-sm" onclick="deleteSession('${s.id}')">✕</button>
      </td>
    </tr>`;
  }).join('');

  setContent(`
    ${pageHeader('Travaux Pratiques','Assignations — '+classeLabel(cl),`
      <button class="btn btn-g btn-sm" onclick="window.open('melec-tp-admin.html','_blank')">🔗 Gérer la bibliothèque</button>
      <button class="btn btn-p" onclick="openAssignTPModal()">+ Assigner un TP</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${sessions.length ? `<table>
          <thead><tr><th>TP</th><th>Élève</th><th>Date</th><th>Progression</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty">
          <div class="ei">🔬</div>
          <div class="et">Aucun TP assigné dans cette classe</div>
          ${!data.tps.length?'<div class="muted" style="margin-top:8px;">Créez des TPs dans la bibliothèque (melec-tp-admin)</div>':''}
        </div>`}
      </div>
    </div>
  `);
}

function openAssignTPModal() {
  const cl = state.classe;
  document.getElementById('assign-classe').value = cl;
  document.getElementById('assign-date').value = today();
  const sel = document.getElementById('assign-tp-id');
  sel.innerHTML = data.tps.length
    ? data.tps.filter(t=>(t.niveaux||[]).length===0||(t.niveaux||[]).includes(classeNiveau(cl)))
        .map(t=>`<option value="${t.id}">${esc(t.titre)} · ${(t.niveaux||[]).join(',')}</option>`).join('')
    : '<option value="">Aucun TP dans la bibliothèque</option>';
  refreshAssignEleves();
  openModal('modal-assign-tp');
}

function classeNiveau(cl) {
  return {'2MELEC':'2nde','1MELEC':'1ère','T-MELEC':'Terminale'}[cl]||cl;
}

function refreshAssignEleves() {
  const cl = document.getElementById('assign-classe')?.value||state.classe;
  const elv = elevesByClasse(cl);
  document.getElementById('assign-eleves').innerHTML = elv.map(e=>`
    <label style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;cursor:pointer;">
      <input type="checkbox" value="${e.id}">
      <span style="font-size:12px;">${esc(e.nom)} ${esc(e.prenom)}</span>
    </label>`).join('');
}

function saveAssignTP() {
  const tpId    = document.getElementById('assign-tp-id').value;
  const cl      = document.getElementById('assign-classe').value;
  const date    = document.getElementById('assign-date').value;
  const seances = parseInt(document.getElementById('assign-seances').value)||2;
  if (!tpId) { toast('Sélectionnez un TP','err'); return; }
  const selected = [...document.querySelectorAll('#assign-eleves input:checked')].map(i=>i.value);
  if (!selected.length) { toast('Sélectionnez au moins un élève','err'); return; }
  selected.forEach(eleveId=>{
    data.sessions.push({
      id:genId('SES'), tpId, eleveId, classe:cl, date,
      seances, seancesDone:0, statut:'assigne',
      teacherId: state.enseignant?.id||'',
    });
  });
  saveLocal(); closeModal('modal-assign-tp'); render();
  toast(`TP assigné à ${selected.length} élève(s)','ok`);
}

function addSeance(sessionId) {
  const s = data.sessions.find(x=>x.id===sessionId);
  if (s) { s.seancesDone=(s.seancesDone||0)+1; if(s.seancesDone>=s.seances)s.statut='termine'; }
  saveLocal(); render();
}

function toggleStatutTP(sessionId) {
  const s = data.sessions.find(x=>x.id===sessionId);
  if (s) s.statut = s.statut==='termine'?'en_cours':'termine';
  saveLocal(); render();
}

function deleteSession(id) {
  askConfirm('Supprimer cette assignation de TP ?','',()=>{
    data.sessions=data.sessions.filter(x=>x.id!==id); saveLocal(); render(); toast('Supprimée','ok');
  });
}

function renderCours() {
  const cl = state.classe;
  const cours = data.cours.filter(c=>c.level===cl).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const statut_lbl = {done:'Terminé',todo:'À faire',doing:'En cours'};
  const statut_cls = {done:'b-green',todo:'b-gray',doing:'b-blue'};

  const rows = cours.map(c=>`<tr>
    <td>${esc(c.title||c.titre||'—')}</td>
    <td>${esc(enseignantNom(c.teacher||c.teacherId))}</td>
    <td class="td-mono">${c.date||'—'}</td>
    <td><span class="badge ${statut_cls[c.status]||'b-gray'}">${statut_lbl[c.status]||c.status||'—'}</span></td>
    <td><button class="btn btn-d btn-sm" onclick="deleteCours('${c.id}')">✕</button></td>
  </tr>`).join('');

  setContent(`
    ${pageHeader('Cours dispensés',classeLabel(cl))}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${cours.length ? `<table>
          <thead><tr><th>Intitulé</th><th>Enseignant</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">📖</div><div class="et">Aucun cours enregistré</div></div>'}
      </div>
    </div>
  `);
}

function deleteCours(id){
  askConfirm('Supprimer ce cours ?','',()=>{data.cours=data.cours.filter(c=>c.id!==id);saveLocal();render();toast('Supprimé','ok');});
}

// ════════════════════════════════════════════════════════════
// BONS D'INTERVENTION
// ════════════════════════════════════════════════════════════
function renderBons() {
  const cl = state.classe;
  const bons = data.bons.filter(b=>b.eleveLevel===cl).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const rows = bons.map(b=>{
    const e=data.eleves.find(x=>x.id===b.eleveId);
    const termine = b.termine==='oui';
    return `<tr>
      <td>${esc(b.numero||'—')}</td>
      <td>${esc(e?e.nom+' '+e.prenom:b.intervenant||'?')}</td>
      <td>${esc(b.projet||'—')}</td>
      <td>${esc(b.client||'—')}</td>
      <td class="td-mono">${(b.bonLe||b.createdAt||'—').slice(0,10)}</td>
      <td><span class="badge ${termine?'b-green':'b-orange'}">${termine?'Terminé':'En cours'}</span></td>
      <td>
        ${b.sigEnseignant?`<span class="badge b-blue" title="${b.sigEnseignant}">✓ Signé</span>`:'<span class="badge b-gray">Non signé</span>'}
      </td>
    </tr>`;
  }).join('');

  setContent(`
    ${pageHeader('Bons d\'intervention','Travaux réalisés par les élèves — '+classeLabel(cl))}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${bons.length ? `<table>
          <thead><tr><th>N°</th><th>Élève</th><th>Projet</th><th>Client</th><th>Date</th><th>Statut</th><th>Signature</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">📋</div><div class="et">Aucun bon d\'intervention</div></div>'}
      </div>
    </div>
  `);
}

// ════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════
function renderConfig() {
  setContent(`
    ${pageHeader('Configuration Gist')}
    <div class="card">
      <div class="card-head"><span>🔗</span><span class="card-title">Connexion GitHub Gist</span></div>
      <div class="card-body">

          <input type="text" id="cfg-tp-gist" value="${esc(cfg.tpGistId||'')}" placeholder="ID du Gist tp-admin">
        </div>
        <div class="fg"><label>URL app élève</label>
          <input type="text" id="cfg-app-url" value="${esc(cfg.appUrl||'')}" placeholder="https://...github.io/melec-eleve.html">
        </div>
        <div class="fe">

        </div>
      </div>

    <div class="card" style="margin-top:2px;">

        <div class="stats">
          ${Object.entries(CLASSES).map(([cl,lbl])=>`<div class="stat"><div class="stat-v">${elevesByClasse(cl).length}</div><div class="stat-l">${lbl}</div></div>`).join('')}
          <div class="stat"><div class="stat-v">${data.tps.length}</div><div class="stat-l">TPs biblio.</div></div>
          <div class="stat"><div class="stat-v">${data.sessions.length}</div><div class="stat-l">Sessions TP</div></div>
          <div class="stat"><div class="stat-v">${data.bons.length}</div><div class="stat-l">Bons interv.</div></div>
          <div class="stat"><div class="stat-v">${data.appel.length}</div><div class="stat-l">Appels</div></div>
        </div>
        <button class="btn btn-g btn-sm" onclick="loadRemote()">↻ Recharger depuis GitHub</button>
      </div>
    </div>
  `);
}

function saveCfg() {
  cfg.token      = document.getElementById('cfg-token').value.trim();
  cfg.dataGistId = document.getElementById('cfg-data-gist').value.trim();
  cfg.tpGistId   = document.getElementById('cfg-tp-gist').value.trim();
  cfg.appUrl     = document.getElementById('cfg-app-url').value.trim();
  localStorage.setItem('melec_suivi_cfg', JSON.stringify(cfg));
  toast('Configuration enregistrée','ok');
  loadRemote();
}

async function testGist() {
  const tok  = document.getElementById('cfg-token').value.trim();
  const gist = document.getElementById('cfg-data-gist').value.trim();
  if (!tok||!gist) { toast('Token et ID requis','err'); return; }
  try {
    const r = await fetch(`https://api.github.com/gists/${gist}`,{headers:{Authorization:`token ${tok}`}});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    toast('Gist OK — '+Object.keys(d.files).length+' fichiers','ok');
  } catch(e) { toast('Erreur : '+e.message,'err'); }
}

// ════════════════════════════════════════════════════════════
// ENSEIGNANTS (config)
// ════════════════════════════════════════════════════════════
function renderTeachers() {
  const rows = data.teachers.map(t=>`<tr>
    <td><strong>${esc(t.nom)}</strong></td>
    <td>${esc(t.specialite||'—')}</td>
    <td><button class="btn btn-d btn-sm" onclick="deleteTeacher('${t.id}')">Supprimer</button></td>
  </tr>`).join('');

  setContent(`
    ${pageHeader('Enseignants','Équipe pédagogique',
      `<button class="btn btn-p" onclick="openAddTeacher()">+ Ajouter</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;">
        ${data.teachers.length ? `<table>
          <thead><tr><th>Nom</th><th>Spécialité</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">👨‍🏫</div><div class="et">Aucun enseignant</div></div>'}
      </div>
    </div>
  `);
}

function openAddTeacher() {
  const nom  = prompt('Nom et prénom de l\'enseignant :');
  if (!nom) return;
  const spec = prompt('Spécialité / matière (optionnel) :', '') || '';
  const pass = prompt('Mot de passe :');
  if (!pass) return;
  data.teachers.push({ id:genId('T'), nom:nom.trim(), specialite:spec, pass:hashSimple(pass) });
  saveLocal(); renderTeachers(); toast('Enseignant ajouté','ok');
}

function deleteTeacher(id) {
  askConfirm('Supprimer cet enseignant ?','',()=>{
    data.teachers=data.teachers.filter(t=>t.id!==id); saveLocal(); renderTeachers(); toast('Supprimé','ok');
  });
}

// ════════════════════════════════════════════════════════════
// EXPORT
// ════════════════════════════════════════════════════════════
function renderExport() {
  setContent(`
    ${pageHeader('Export / Import','Sauvegarde et restauration des données')}
    <div class="card">
      <div class="card-head"><span>💾</span><span class="card-title">Export JSON</span></div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-g" onclick="exportFile('eleves','eleves.json')">⬇️ eleves.json</button>
        <button class="btn btn-g" onclick="exportFile('appel','appel.json')">⬇️ appel.json</button>
        <button class="btn btn-g" onclick="exportFile('notes','notes.json')">⬇️ notes.json</button>
        <button class="btn btn-g" onclick="exportFile('pfmp','pfmp.json')">⬇️ pfmp.json</button>
        <button class="btn btn-g" onclick="exportAll()">⬇️ Tout exporter (archive)</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span>📂</span><span class="card-title">Import JSON</span></div>
      <div class="card-body">
        <input type="file" accept=".json" onchange="handleImport(event)" style="color:var(--text2);font-size:12px;">
        <div class="hint" style="margin-top:8px;">Format attendu : export complet ou fichier individuel</div>
      </div>
    </div>
  `);
}

function exportFile(key, fname) {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data[key],null,2)],{type:'application/json'}));
  a.download=fname; a.click();
}

function exportAll() {
  const all={eleves:data.eleves,teachers:data.teachers,appel:data.appel,habilitations:data.habilitations,
    pfmp:data.pfmp,notes:data.notes,bons:data.bons,cours:data.cours,sessions:data.sessions};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));
  a.download='melec-backup-'+today()+'.json'; a.click();
}

function handleImport(e) {
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const d=JSON.parse(ev.target.result);
    if(Array.isArray(d)){
      // fichier unique (ex: eleves.json) — détecter le type
      if(d[0]?.nom&&d[0]?.prenom&&d[0]?.classe){data.eleves=d;toast('Élèves importés','ok');}
      else if(d[0]?.date&&d[0]?.presences){data.appel=d;toast('Appel importé','ok');}
      else toast('Format non reconnu','err');
    } else {
      if(d.eleves)   data.eleves=d.eleves;
      if(d.teachers) data.teachers=d.teachers;
      if(d.appel)    data.appel=d.appel;
      if(d.habilitations) data.habilitations=d.habilitations;
      if(d.pfmp)     data.pfmp=d.pfmp;
      if(d.notes)    data.notes=d.notes;
      if(d.bons)     data.bons=d.bons;
      if(d.sessions) data.sessions=d.sessions;
      toast('Import réussi','ok');
    }
    saveLocal(); render();
  }catch(err){toast('Erreur JSON : '+err.message,'err');}};
  r.readAsText(f);
}

          Les PFMP, habilitations et sessions TP suivent les élèves.

function askMontee() {
  askConfirm('Montée de niveau — cette action est irréversible.','Tapez MONTEE pour confirmer :',()=>{
    const upgrade={'2MELEC':'1MELEC','1MELEC':'T-MELEC'};
    data.eleves = data.eleves.filter(e=>e.classe!=='T-MELEC').map(e=>({...e,classe:upgrade[e.classe]||e.classe}));
    saveLocal(); render(); toast('Montée de niveau effectuée','ok');
  },'MONTEE');
}

function askEffacer() {
  askConfirm('⚠️ Effacer TOUTES les données — irréversible.','Tapez EFFACER pour confirmer :',()=>{
    data={eleves:[],teachers:[],appel:[],habilitations:{},pfmp:[],notes:{},bons:[],cours:[],tps:[],sessions:[]};
    saveLocal(); render(); toast('Données effacées','ok');
  },'EFFACER');
}

// ════════════════════════════════════════════════════════════
// AUTH ENSEIGNANT
// ════════════════════════════════════════════════════════════
function prefillForms() {
  const sel = document.getElementById('login-ens');
  // refresh dynamique au clic
}

function openLoginModal() {
  const sel = document.getElementById('login-ens');
  sel.innerHTML = data.teachers.map(t=>`<option value="${t.id}">${esc(t.nom)}</option>`).join('');
  document.getElementById('login-pass').value='';
  document.getElementById('login-err').style.display='none';
  openModal('modal-login');
}

function doLogin() {
  const id   = document.getElementById('login-ens').value;
  const pass = document.getElementById('login-pass').value;
  const t = data.teachers.find(x=>x.id===id);
  if (!t) return;
  if (t.pass && hashSimple(pass)!==t.pass && pass!=='admin') {
    document.getElementById('login-err').style.display='block'; return;
  }
  state.enseignant = t;
  document.getElementById('ens-name').textContent = t.nom.split(' ')[0];
  document.querySelector('.ens-lock').textContent = '✓';
  closeModal('modal-login');
  toast('Connecté : '+t.nom,'ok');
}

// Ouvrir login modal depuis le badge
document.querySelector('.ens-badge').onclick = () => {
  if (!data.teachers.length) { toast('Aucun enseignant configuré (Config → Enseignants)','err'); return; }
  openLoginModal();
};

// ════════════════════════════════════════════════════════════
// MODALES UTILS
// ════════════════════════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

function askConfirm(title, body, cb, keyword) {
  confirmCb = cb;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body||'';
  const wrap = document.getElementById('confirm-input-wrap');
  if (keyword) {
    wrap.style.display='flex';
    document.getElementById('confirm-input-label').textContent='Saisissez "'+keyword+'" pour confirmer';
    document.getElementById('confirm-input').value='';
    document.getElementById('confirm-ok-btn').dataset.kw = keyword;
  } else { wrap.style.display='none'; }
  openModal('modal-confirm');
}

function confirmAction() {
  const kw = document.getElementById('confirm-ok-btn').dataset.kw;
  if (kw && document.getElementById('confirm-input').value !== kw) {
    toast('Confirmation incorrecte','err'); return;
  }
  closeModal('modal-confirm');
  if (confirmCb) confirmCb();
}

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = (type==='ok'?'✓ ':'✕ ')+msg;
  el.className = 'toast show '+type;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'),3000);
}
