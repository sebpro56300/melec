function renderCours() {
  const cl = state.classe;
  const cours = data.cours.filter(c=>(c.level||c.classe)===cl).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const statut_lbl = {done:'Terminé',todo:'À faire',doing:'En cours'};
  const statut_cls = {done:'b-green',todo:'b-gray',doing:'b-blue'};

  const rows = cours.map(c=>`<tr>
    <td>
      ${c.url?`<a href="${esc(c.url)}" target="_blank" style="color:var(--accent2);">${esc(c.titre||c.title||'—')}</a>`
             :esc(c.titre||c.title||'—')}
    </td>
    <td>${esc(enseignantNom(c.teacher||c.teacherId))}</td>
    <td class="td-mono">${c.date||'—'}</td>
    <td><span class="badge ${statut_cls[c.status]||'b-gray'}">${statut_lbl[c.status]||c.status||'—'}</span></td>
    <td>
      <select class="btn btn-g btn-sm" style="padding:2px 6px;" onchange="setCoursStatut('${c.id}',this.value)">
        <option value="todo" ${c.status==='todo'?'selected':''}>À faire</option>
        <option value="doing" ${c.status==='doing'?'selected':''}>En cours</option>
        <option value="done" ${c.status==='done'?'selected':''}>Terminé</option>
      </select>
      <button class="btn btn-d btn-sm" onclick="deleteCours('${c.id}')">✕</button>
    </td>
  </tr>`).join('');

  setContent(`
    ${pageHeader('Cours dispensés',classeLabel(cl)+' — '+cours.length+' cours',
      `<button class="btn btn-p" onclick="openCoursModal()">+ Ajouter un cours</button>`)}
    <div class="card">
      <div class="card-body" style="padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch;">
        ${cours.length ? `<table>
          <thead><tr><th>Intitulé</th><th>Enseignant</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : '<div class="empty"><div class="ei">📖</div><div class="et">Aucun cours enregistré</div></div>'}
      </div>
    </div>
  `);
}

function onCoursSelChange() {
  const sel = document.getElementById('cours-ressource-sel');
  const opt = sel?.options[sel.selectedIndex];
  if (opt?.value && opt.dataset.titre) {
    document.getElementById('cours-titre-input').value = opt.dataset.titre;
  }
}

function onCoursFileChange() {
  const f = document.getElementById('cours-file-input').files[0];
  const st = document.getElementById('cours-upload-status');
  if (f) {
    st.textContent = '📁 '+f.name+' ('+fmtSz(f.size)+') — sera uploadé lors de la validation';
    st.style.color = 'var(--orange)';
    if (!document.getElementById('cours-titre-input').value) {
      document.getElementById('cours-titre-input').value = f.name.replace(/\.[^.]+$/,'');
    }
  } else {
    st.textContent = '';
  }
}

function fmtSz(b){if(b<1024)return b+' o';if(b<1048576)return(b/1024).toFixed(1)+' Ko';return(b/1048576).toFixed(1)+' Mo';}

function openCoursModal() {
  const coursDispo = (data.ressources||[]).filter(r=>r.rubrique==='Cours');
  const sel = document.getElementById('cours-ressource-sel');
  if (sel) {
    sel.innerHTML = '<option value="">-- Choisir dans la bibliothèque --</option>'
      + coursDispo.map(r=>`<option value="${r.id}" data-url="${esc(r.url)}" data-titre="${esc(r.titre)}">${esc(r.niveau)} — ${esc(r.titre)}</option>`).join('');
  }
  document.getElementById('cours-date').value = today();
  document.getElementById('cours-classe-sel').value = state.classe;
  document.getElementById('cours-titre-input').value = '';
  document.getElementById('cours-file-input').value = '';
  document.getElementById('cours-upload-status').textContent = '';
  openModal('modal-cours');
}

async function saveCours() {
  const sel    = document.getElementById('cours-ressource-sel');
  const titre  = document.getElementById('cours-titre-input').value.trim();
  const date   = document.getElementById('cours-date').value;
  const cl     = document.getElementById('cours-classe-sel').value;
  const opt    = sel?.options[sel.selectedIndex];
  const titreFinal = titre || (opt?.dataset.titre) || '';
  if (!titreFinal) { toast('Intitulé requis','err'); return; }

  let url = opt?.dataset.url || '';
  const file = document.getElementById('cours-file-input').files[0];

  // Upload fichier si présent
  if (file && cfg.token && cfg.uploadRepo) {
    const btn = document.getElementById('btn-save-cours');
    btn.disabled = true; btn.textContent = '⏳ Upload...';
    const st = document.getElementById('cours-upload-status');
    try {
      url = await uploadToRepo(file);
      st.textContent = '✓ Uploadé : '+url;
      st.style.color = 'var(--green)';
      // Ajouter à ressources.json si token+tpGistId configurés
      if (cfg.tpGistId) {
        const newRes = {
          id: 'RES'+Date.now().toString(36).toUpperCase(),
          titre: titreFinal, type: extToType(file.name),
          url, niveau: classeNiveau(cl), rubrique: 'Cours',
          description: '', uploadedAt: today()
        };
        data.ressources = data.ressources||[];
        data.ressources.push(newRes);
        // Pousser dans le gist tp-admin
        await fetch(`https://api.github.com/gists/${cfg.tpGistId}`, {
          method:'PATCH',
          headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
          body:JSON.stringify({files:{'ressources.json':{content:JSON.stringify(data.ressources,null,2)}}})
        });
      }
    } catch(e) {
      toast('Upload échoué : '+e.message,'err');
      btn.disabled=false; btn.textContent='Ajouter';
      return;
    }
    btn.disabled=false; btn.textContent='Ajouter';
  } else if (file && (!cfg.token || !cfg.uploadRepo)) {
    toast('Configurez le token GitHub et le dépôt (Config) pour uploader','err');
    return;
  }

  data.cours.push({
    id:genId('CRS'), titre:titreFinal, url, date, level:cl, classe:cl,
    teacherId:state.enseignant?.id||'', status:'todo'
  });
  saveLocal(); closeModal('modal-cours'); render(); toast('Cours ajouté','ok');
}

async function uploadToRepo(file) {
  const [owner,repo] = (cfg.uploadRepo||'').split('/');
  if (!owner||!repo) throw new Error('Dépôt non configuré (owner/repo)');
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = 'ressources/'+Date.now()+'_'+safe;
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const b64 = await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=()=>rej(new Error('Lecture impossible'));
    r.readAsDataURL(file);
  });
  const resp = await fetch(apiUrl,{
    method:'PUT',
    headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},
    body:JSON.stringify({message:'MELEC cours — '+file.name, content:b64})
  });
  if (!resp.ok) { const e=await resp.json(); throw new Error(e.message||'HTTP '+resp.status); }
  return (await resp.json()).content.download_url;
}

function extToType(name){
  const ext=name.split('.').pop().toLowerCase();
  return {pdf:'pdf',doc:'word',docx:'word',xls:'excel',xlsx:'excel',jpg:'image',jpeg:'image',png:'image',txt:'txt'}[ext]||'lien';
}

  askConfirm('Supprimer ce cours ?','',()=>{

  });
}

function signerBon(id) {
  const ens = state.enseignant;
  if (!ens) { toast('Connectez-vous d\'abord','err'); return; }
  askConfirm('Signer ce bon d\'intervention ?',`Signature enseignant + client : ${ens.nom}`,()=>{
    const b = data.bons.find(x=>x.id===id);
    if (b) {
      b.sigEnseignant = ens.nom;
      b.sigDate       = today();
      b.sigTeacherId  = ens.id;
      b.sig           = ens.nom; // signature client (jeu de rôle : l'enseignant incarne le client)
      b.sigClientDate = today();
    }
    saveLocal(); render();
    saveAll().then(()=>toast('Bon signé (enseignant + client) ✓','ok'));
  });
}

async function testGist() {
  const tok  = document.getElementById('cfg-token').value.trim();
  const gist = document.getElementById('cfg-data-gist').value.trim();
  if (!tok||!gist) { toast('Token et ID requis','err'); return; }
  try {
    const r = await fetch(`https://api.github.com/gists/${gist}`,{headers:{Authorization:`token ${tok}`}});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    toast('Gist OK — '+Object.keys(d.files).length+' fichiers','ok');
  } catch(e) { toast('Erreur : '+e.message,'err'); }
}

        <button class="btn btn-g" onclick="exportAll()">📦 Archive complète</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span>⬆️</span><span class="card-title">Import</span></div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:10px;">
        <div style="font-size:12px;color:var(--text2);">Importer un fichier JSON exporté précédemment :</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">👥 Élèves (eleves.json)</div>
            <input type="file" accept=".json" onchange="importSpecific(event,'eleves')" style="font-size:11px;color:var(--text2);">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">🔬 Sessions TP</div>
            <input type="file" accept=".json" onchange="importSpecific(event,'sessions')" style="font-size:11px;color:var(--text2);">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">⚡ Habilitations</div>
            <input type="file" accept=".json" onchange="importSpecific(event,'habilitations')" style="font-size:11px;color:var(--text2);">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">📖 Cours</div>
            <input type="file" accept=".json" onchange="importSpecific(event,'cours')" style="font-size:11px;color:var(--text2);">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">📋 Appel</div>
            <input type="file" accept=".json" onchange="importSpecific(event,'appel')" style="font-size:11px;color:var(--text2);">
          </div>
          <div>
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">📦 Archive complète</div>
            <input type="file" accept=".json" onchange="handleImport(event)" style="font-size:11px;color:var(--text2);">
          </div>
        </div>
      </div>
    </div>
  `);
}

function importSpecific(e, key) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d = JSON.parse(ev.target.result);
      const parsed = Array.isArray(d) ? d : (d[key] || d);
      if (key === 'habilitations' && !Array.isArray(d)) {
        data.habilitations = d; // objet, pas tableau
      } else if (Array.isArray(parsed)) {
        data[key] = parsed;
      } else {
        toast('Format non reconnu pour '+key,'err'); return;
      }
      saveLocal(); render();
      toast(key+' importé ('+( Array.isArray(data[key]) ? data[key].length : Object.keys(data[key]).length )+' entrées)','ok');
    } catch(err) { toast('Erreur JSON : '+err.message,'err'); }
  };
  r.readAsText(f);
}

function exportFile(key, fname) {
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data[key],null,2)],{type:'application/json'}));
  a.download=fname; a.click();
}

function exportAll() {
  const all={eleves:data.eleves,teachers:data.teachers,appel:data.appel,habilitations:data.habilitations,
    pfmp:data.pfmp,notes:data.notes,bons:data.bons,cours:data.cours,sessions:data.sessions};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(all,null,2)],{type:'application/json'}));
  a.download='melec-backup-'+today()+'.json'; a.click();
}

function handleImport(e) {
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{
    const d=JSON.parse(ev.target.result);
    if(Array.isArray(d)){
      // fichier unique (ex: eleves.json) — détecter le type
      if(d[0]?.nom&&d[0]?.prenom&&d[0]?.classe){data.eleves=d;toast('Élèves importés','ok');}
      else if(d[0]?.date&&d[0]?.presences){data.appel=d;toast('Appel importé','ok');}
      else toast('Format non reconnu','err');
    } else {
      if(d.eleves)   data.eleves=d.eleves;
      if(d.teachers) data.teachers=d.teachers;
      if(d.appel)    data.appel=d.appel;
      if(d.habilitations) data.habilitations=d.habilitations;
      if(d.pfmp)     data.pfmp=d.pfmp;
      if(d.notes)    data.notes=d.notes;
      if(d.bons)     data.bons=d.bons;
      if(d.sessions) data.sessions=d.sessions;
      toast('Import réussi','ok');
    }
    saveLocal(); render();
  }catch(err){toast('Erreur JSON : '+err.message,'err');}};
  r.readAsText(f);
}

// ════════════════════════════════════════════════════════════
// FIN D'ANNÉE
// ════════════════════════════════════════════════════════════
function renderAnnee() {
  setContent(`
    ${pageHeader('Fin d\'année','Passage de classe et archivage')}
    <div class="card" style="border-color:var(--orange);">
      <div class="card-head" style="background:#251a0a;border-color:var(--orange);">
        <span>🎓</span><span class="card-title" style="color:var(--orange);">Montée de niveau</span>
      </div>
      <div class="card-body">
        <p style="font-size:13px;color:var(--text2);margin-bottom:14px;">
          • 2nde MELEC → 1ère MELEC<br>
          • 1ère MELEC → Terminale MELEC<br>
          • Terminales → archivés et supprimés<br><br>
          Les PFMP, habilitations et sessions TP suivent les élèves.
        </p>
        <button class="btn btn-o" onclick="askMontee()">🎓 Lancer la montée de niveau</button>
      </div>
    </div>
    <div class="card" style="border-color:var(--red);margin-top:2px;">
      <div class="card-head" style="background:#1f0a0a;border-color:var(--red);">
        <span>⚠️</span><span class="card-title" style="color:var(--red);">Zone dangereuse</span>
      </div>
      <div class="card-body">
        <button class="btn btn-d" onclick="askEffacer()">⚠️ Effacer toutes les données</button>
      </div>
    </div>
  `);
}

function askMontee() {
  askConfirm('Montée de niveau — cette action est irréversible.','Tapez MONTEE pour confirmer :',()=>{
    const upgrade={'2MELEC':'1MELEC','1MELEC':'T-MELEC'};
    data.eleves = data.eleves.filter(e=>e.classe!=='T-MELEC').map(e=>({...e,classe:upgrade[e.classe]||e.classe}));
    saveLocal(); render(); toast('Montée de niveau effectuée','ok');
  },'MONTEE');
}

function askEffacer() {
  askConfirm('⚠️ Effacer TOUTES les données — irréversible.','Tapez EFFACER pour confirmer :',()=>{
    data={eleves:[],teachers:[],appel:[],habilitations:{},pfmp:[],notes:{},bons:[],cours:[],tps:[],sessions:[]};
    saveLocal(); render(); toast('Données effacées','ok');
  },'EFFACER');
}

// ════════════════════════════════════════════════════════════
// MODALES UTILS
// ════════════════════════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-ov').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open');}));

function askConfirm(title, body, cb, keyword) {
  confirmCb = cb;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent  = body||'';
  const wrap = document.getElementById('confirm-input-wrap');
  if (keyword) {
    wrap.style.display='flex';
    document.getElementById('confirm-input-label').textContent='Saisissez "'+keyword+'" pour confirmer';
    document.getElementById('confirm-input').value='';
    document.getElementById('confirm-ok-btn').dataset.kw = keyword;
  } else { wrap.style.display='none'; }
  openModal('modal-confirm');
}

function confirmAction() {
  const kw = document.getElementById('confirm-ok-btn').dataset.kw;
  if (kw && document.getElementById('confirm-input').value !== kw) {
    toast('Confirmation incorrecte','err'); return;
  }
  closeModal('modal-confirm');
  if (confirmCb) confirmCb();
}

// ════════════════════════════════════════════════════════════
// DIAGNOSTIC & CORRECTION SESSIONS
// ════════════════════════════════════════════════════════════
function diagSessions() {
  const ids = data.sessions.map(s=>s.id);
  const dupes = ids.filter((id,i)=>ids.indexOf(id)!==i);
  const noId  = data.sessions.filter(s=>!s.id);
  const noCl  = data.sessions.filter(s=>!s.classe&&!s.level);

  let msg = `Sessions totales : ${data.sessions.length}\n`;
  msg += `IDs dupliqués : ${dupes.length} (${dupes.slice(0,5).join(', ')||'aucun'})\n`;
  msg += `Sans ID : ${noId.length}\n`;
  msg += `Sans classe : ${noCl.length}\n\n`;
  msg += `Détail :\n`;
  data.sessions.forEach((s,i)=>{
    const e = data.eleves.find(x=>x.id===s.eleveId);
    const t = data.tps.find(x=>x.id===s.tpId);
    msg += `[${i}] id=${s.id||'⚠️VIDE'} | ${e?e.nom+' '+e.prenom:'élève?'} | ${t?t.titre.substring(0,25)+'…':'tp?'} | classe=${s.classe||s.level||'⚠️?'} | ${s.statut}\n`;
  });

  document.getElementById('content').insertAdjacentHTML('afterbegin',`
    <div class="card" style="border-color:var(--orange);margin-bottom:14px;">
      <div class="card-head" style="background:#251a0a;border-color:var(--orange);">
        <span>🔍</span><span class="card-title" style="color:var(--orange);">Diagnostic sessions TP</span>
        <button class="btn btn-g btn-sm" style="margin-left:auto" onclick="this.closest('.card').remove()">✕</button>
      </div>
      <div class="card-body">
        <pre style="font-size:11px;font-family:var(--mono);color:var(--text2);white-space:pre-wrap;max-height:300px;overflow-y:auto;background:var(--bg);padding:10px;border-radius:6px;">${msg}</pre>
        ${(dupes.length||noId.length||noCl.length)
          ? `<button class="btn btn-o" style="margin-top:8px;width:100%;" onclick="fixSessions()">🔧 Corriger automatiquement les IDs/classes manquants</button>`
          : `<div style="color:var(--green);font-size:12px;margin-top:8px;">✓ Aucun problème détecté dans les IDs — le bug vient peut-être du cache. Essayez de vider les sessions et réassigner.</div>`}
        <button class="btn btn-d" style="margin-top:8px;width:100%;" onclick="askConfirm('Supprimer TOUTES les sessions TP ?','Cette action est irréversible.',()=>{data.sessions=[];saveLocal();render();toast(\'Sessions effacées\',\'ok\');})">🗑️ Vider toutes les sessions</button>
      </div>
    </div>`);
}

function fixSessions() {
  const seenIds = new Set();
  data.sessions.forEach(s=>{
    if (!s.id || seenIds.has(s.id)) s.id = genId('SES');
    seenIds.add(s.id);
    if (!s.classe && s.level) s.classe = s.level;
    if (!s.evaluations) s.evaluations = {};
    if (s.seancesDone===undefined) s.seancesDone = 0;
  });
  saveLocal();
  toast('Sessions corrigées ✓','ok');
  render();
}

// ════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = (type==='ok'?'✓ ':'✕ ')+msg;
  el.className = 'toast show '+type;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'),3000);
}

// ════════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════════
init();
</script>
