<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MELEC Élève">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e3a5f">
<title>MELEC — Espace Élève</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0d1520;--bg2:#111e2e;--bg3:#172438;--bg4:#1e2f47;
  --border:#1e3a5f;--border2:#2a5080;
  --accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;
  --green:#22c55e;--orange:#f59e0b;--red:#ef4444;--purple:#a78bfa;--teal:#2dd4bf;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Syne',sans-serif;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;flex-direction:column;}

/* ── LOGIN ──────────────────────────────────────────── */
#login-screen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;z-index:1000;padding:20px;
}
#login-screen.hidden{display:none;}
.login-logo{font-family:var(--display);font-size:36px;font-weight:800;color:var(--accent2);letter-spacing:.05em;text-align:center;margin-bottom:4px;}
.login-logo small{display:block;font-size:13px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
.login-box{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px;width:100%;max-width:360px;margin-top:24px;
}
.login-box h2{font-family:var(--display);font-size:16px;font-weight:700;color:var(--accent2);margin-bottom:4px;}
.login-box p{font-size:12px;color:var(--text3);margin-bottom:20px;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.fg label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);}
.fg input{
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;color:var(--text);font-size:15px;font-family:var(--sans);width:100%;
}
.fg input:focus{outline:none;border-color:var(--accent);}
.login-err{font-size:12px;color:var(--red);margin-top:4px;display:none;}
.btn-login{
  width:100%;padding:14px;border-radius:10px;background:var(--accent);color:#fff;
  font-size:15px;font-weight:700;font-family:var(--display);border:none;cursor:pointer;
  letter-spacing:.03em;margin-top:8px;transition:background .15s;
}
.btn-login:hover{background:#2563eb;}

/* ── HEADER ─────────────────────────────────────────── */
#header{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;height:52px;flex-shrink:0;
  display:flex;align-items:center;gap:12px;
}
.header-logo{font-family:var(--display);font-size:18px;font-weight:800;color:var(--accent2);}
.header-logo small{font-size:11px;font-weight:600;color:var(--text3);margin-left:6px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.eleve-chip{
  display:flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--bg3);border:1px solid var(--border);border-radius:20px;
  font-size:12px;cursor:pointer;
}
.eleve-chip .ec-name{font-weight:600;color:var(--text);}
.eleve-chip .ec-class{font-size:10px;color:var(--text3);font-family:var(--mono);}

/* ── NAV BOTTOM ─────────────────────────────────────── */
#nav{
  height:var(--nav-h);flex-shrink:0;
  background:var(--bg2);border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  safe-area-inset-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  flex:1;background:none;border:none;color:var(--text3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  cursor:pointer;transition:color .15s;font-family:var(--sans);padding:4px 2px;
}
.nav-btn .ni{font-size:20px;line-height:1;}
.nav-btn.on{color:var(--accent2);}
.nav-btn .badge-dot{
  position:absolute;width:7px;height:7px;background:var(--orange);
  border-radius:50%;top:-2px;right:-2px;border:1.5px solid var(--bg2);
}
.nav-ico-wrap{position:relative;display:inline-flex;}

/* ── CONTENT ─────────────────────────────────────────── */
#content{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding:16px;}

/* ── PAGE ACCUEIL ────────────────────────────────────── */
.welcome-header{
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg3) 100%);
  border:1px solid var(--border);border-radius:14px;
  padding:20px;margin-bottom:14px;
}
.welcome-nom{font-family:var(--display);font-size:22px;font-weight:800;color:var(--accent2);}
.welcome-classe{font-size:12px;color:var(--text3);font-family:var(--mono);margin-top:3px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-v{font-family:var(--display);font-size:24px;font-weight:800;color:var(--accent2);}
.stat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

/* ── CARDS ────────────────────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.card-head{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg3);}
.card-title{font-family:var(--display);font-size:13px;font-weight:700;color:var(--text);flex:1;}
.card-body{padding:14px;}

/* ── LINK CARD ────────────────────────────────────────── */
.link-card{
  display:flex;align-items:center;gap:12px;padding:13px 15px;
  background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  margin-bottom:8px;cursor:pointer;text-decoration:none;
  transition:border-color .15s,background .15s;
}
.link-card:hover{border-color:var(--accent);background:var(--bg4);}
.link-card .lc-icon{font-size:24px;flex-shrink:0;}
.link-card .lc-info{flex:1;}
.link-card .lc-title{font-size:13px;font-weight:600;color:var(--text);}
.link-card .lc-sub{font-size:11px;color:var(--text3);margin-top:2px;line-height:1.4;}
.link-card .lc-arrow{color:var(--text3);font-size:16px;flex-shrink:0;}

/* ── TP CARD ──────────────────────────────────────────── */
.tp-current{
  background:linear-gradient(135deg,#111f3a 0%,#1a2e50 100%);
  border:1px solid var(--accent);border-radius:12px;padding:16px;margin-bottom:12px;
}
.tp-title{font-family:var(--display);font-size:17px;font-weight:800;color:var(--accent2);margin-bottom:6px;}
.tp-meta{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:12px;}
.progress-bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
.progress-label{font-size:10px;color:var(--text3);font-family:var(--mono);}

/* RESSOURCES docs */
.doc-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.doc-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  cursor:pointer;transition:all .12s;
}
.doc-item:hover{border-color:var(--accent2);background:var(--bg3);}
.doc-ico{font-size:20px;flex-shrink:0;}
.doc-info{flex:1;min-width:0;}
.doc-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.doc-crumb{font-size:10px;color:var(--teal);margin-top:2px;}
.doc-arrow{color:var(--text3);font-size:13px;flex-shrink:0;}

/* ── AUTO-ÉVAL ────────────────────────────────────────── */
.comp-section{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:8px;}
.comp-head-row{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;user-select:none;}
.comp-code-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent2);background:#111f3a;padding:2px 7px;border-radius:4px;flex-shrink:0;}
.comp-toggle-ico{color:var(--text3);font-size:11px;transition:transform .2s;flex-shrink:0;}
.comp-toggle-ico.open{transform:rotate(90deg);}
.comp-criteres{padding:10px 13px;display:flex;flex-direction:column;gap:8px;}
.crit-item{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;}
.crit-label{font-size:12px;margin-bottom:8px;color:var(--text);}
.eval-dots-row{display:flex;gap:8px;align-items:center;}
.eval-dot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:all .15s;flex-shrink:0;
}
.eval-dot:hover{transform:scale(1.15);}
.eval-dot.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.3);}
.eval-dot.bleu{background:#3b82f6;}
.eval-dot.rouge{background:#ef4444;}
.eval-dot.orange{background:#f59e0b;}
.eval-dot.vclair{background:#86efac;}
.eval-dot.vfonce{background:#16a34a;}
.eval-ens-row{margin-top:6px;font-size:10px;color:var(--text3);display:flex;align-items:center;gap:6px;}
.eval-ens-dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--border);flex-shrink:0;}
.eval-ens-dot.bleu{background:#3b82f6;}
.eval-ens-dot.rouge{background:#ef4444;}
.eval-ens-dot.orange{background:#f59e0b;}
.eval-ens-dot.vclair{background:#86efac;}
.eval-ens-dot.vfonce{background:#16a34a;}

/* ── SCANNER ──────────────────────────────────────────── */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:0;}
.modal-ov.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px 18px 0 0;width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;padding:20px;}
.modal-title{font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:14px;color:var(--accent2);}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
#scanner-container{width:100%;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:1;}

/* ── HABILITATIONS ────────────────────────────────────── */
.hab-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.hab-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.hab-type{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:8px;}
.hab-line{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text2);margin-bottom:5px;}
.hab-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
.hab-dot.ok{background:var(--green);border-color:var(--green);}

/* ── TP TERMINÉS ──────────────────────────────────────── */
.tp-done-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.tp-done-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
.tp-done-meta{font-size:10px;color:var(--text3);font-family:var(--mono);margin-bottom:8px;}
.comp-eval-summary{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.ces-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2);}
.ces-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}

/* ── COURS ────────────────────────────────────────────── */
.cours-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  margin-bottom:8px;cursor:pointer;transition:all .12s;
}
.cours-item:hover{border-color:var(--accent2);background:var(--bg3);}
.cours-status{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.st-done{background:var(--green);}
.st-todo{background:var(--text3);}
.st-doing{background:var(--orange);}

/* ── BOUTONS ──────────────────────────────────────────── */
.btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--sans);transition:all .15s;}
.btn-p{background:var(--accent);color:#fff;}.btn-p:hover{background:#2563eb;}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);}.btn-g:hover{background:var(--bg3);color:var(--text);}
.btn-t{background:var(--teal);color:#111;}.btn-t:hover{background:#14b8a6;}
.btn-full{width:100%;padding:14px;font-size:14px;font-family:var(--display);letter-spacing:.03em;}
.btn-sm{padding:5px 11px;font-size:11px;}

/* ── UTILS ────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;font-family:var(--mono);}
.b-green{background:#14231a;color:var(--green);border:1px solid #1a3a26;}
.b-blue{background:#111f3a;color:var(--accent2);border:1px solid #1a3060;}
.b-orange{background:#251a0a;color:var(--orange);border:1px solid #3a2810;}
.b-gray{background:var(--bg3);color:var(--text3);border:1px solid var(--border);}
.muted{color:var(--text3);font-size:12px;}
.section-title{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:8px;margin-top:14px;}
.warn-box{background:#251a0a;border:1px solid var(--orange);border-radius:8px;padding:11px 14px;font-size:12px;color:#fcd34d;line-height:1.6;margin-bottom:10px;}
#toast{position:fixed;bottom:calc(var(--nav-h) + 10px);left:50%;transform:translateX(-50%);
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 18px;
  font-size:12px;z-index:999;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);white-space:nowrap;}
#toast.show{display:block;}
#toast.ok{border-color:var(--green);}
#toast.err{border-color:var(--red);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-logo">⚡MELEC<small>Espace Élève</small></div>
  <div class="login-box">
    <h2>🎓 Connexion élève</h2>
    <p>Utilisez les identifiants fournis par votre enseignant</p>
    <div class="fg"><label>NOM (en majuscules)</label>
      <input type="text" id="l-nom" placeholder="EX: DUPONT" autocomplete="off" autocapitalize="characters"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="fg"><label>Prénom</label>
      <input type="text" id="l-prenom" placeholder="Ex: Jean"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="fg"><label>Mot de passe</label>
      <input type="password" id="l-pass" placeholder="••••••"
        onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-err" id="l-err">Identifiants incorrects.</div>
    <button class="btn-login" onclick="doLogin()">Se connecter</button>
    <div id="l-status" style="margin-top:10px;font-size:11px;text-align:center;color:var(--text3);min-height:16px;"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────── -->
<div id="header" style="display:none;">
  <div class="header-logo">⚡<small>MELEC</small></div>
  <div class="header-right">
    <div class="eleve-chip" onclick="showPage('accueil')">
      <span class="ec-name" id="h-name">—</span>
      <span class="ec-class" id="h-class">—</span>
    </div>
    <button class="btn btn-g btn-sm" onclick="doLogout()">↩</button>
  </div>
</div>

<div id="content" style="display:none;"></div>

<div id="nav" style="display:none;">
  <button class="nav-btn on" id="nb-accueil" onclick="showPage('accueil')">
    <span class="ni">🏠</span>Accueil
  </button>
  <button class="nav-btn" id="nb-tp" onclick="showPage('tp')">
    <div class="nav-ico-wrap"><span class="ni">🔧</span></div>TP
  </button>
  <button class="nav-btn" id="nb-tp-done" onclick="showPage('tp-done')">
    <span class="ni">✅</span>Terminés
  </button>
  <button class="nav-btn" id="nb-cours" onclick="showPage('cours')">
    <span class="ni">📖</span>Cours
  </button>
  <button class="nav-btn" id="nb-hab" onclick="showPage('hab')">
    <span class="ni">⚡</span>Habilit.
  </button>
</div>

<!-- ── MODAL SCANNER ─────────────────────────────────── -->
<div class="modal-ov" id="modal-scan">
  <div class="modal">
    <div class="modal-title">📷 Scanner le QR code du système</div>
    <div id="scanner-container"></div>
    <div style="margin-top:10px;font-size:12px;color:var(--text3);text-align:center;">
      Ou saisir le code manuellement :
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <input type="text" id="scan-manual" placeholder="Ex: MELEC-001" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:var(--mono);"
        onkeydown="if(event.key==='Enter')onManualCode()">
      <button class="btn btn-p" onclick="onManualCode()">OK</button>
    </div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeScan()">Annuler</button>
    </div>
  </div>
</div>

<!-- ── MODAL CHOIX TP ─────────────────────────────────── -->
<div class="modal-ov" id="modal-tp-choice">
  <div class="modal">
    <div class="modal-title" id="tp-choice-title">Choisir un TP</div>
    <div id="tp-choice-list" style="display:flex;flex-direction:column;gap:7px;max-height:50dvh;overflow-y:auto;"></div>
    <div class="modal-foot">
      <button class="btn btn-g" onclick="closeModal('modal-tp-choice')">Annuler</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
// ════════════════════════════════════════════════════════
// CONSTANTES
// ════════════════════════════════════════════════════════
const CLASSES = {'2MELEC':'2nde MELEC','1MELEC':'1ère MELEC','T-MELEC':'Terminale MELEC'};
const EVAL_COULEURS = ['bleu','rouge','orange','vclair','vfonce'];
const EVAL_LABELS   = {bleu:'Non évalué',rouge:'Absent/Non fait',orange:'En cours',vclair:'Acquis',vfonce:'Maîtrisé'};
const TYPE_ICON     = {pdf:'📄',word:'📝',excel:'📊',image:'🖼️',video:'🎬',txt:'📃',lien:'🔗'};
const HAB_TYPES     = ['B0','B1V','BR'];

// IDs des Gists publics — intégrés en dur, aucune config requise côté élève
const GIST_DATA = 'a953954f369f7fad1597e2a6da38578c'; // eleves, cours, habilitations
const GIST_TP   = '5cbd51c7c62493addf84845feddd19d7'; // tps, sessions, ressources

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
// token : optionnel, uniquement pour l'enseignant qui veut sauver les sessions
let cfg = { token: '' };
let eleve = null;
let data = {
  eleves:[], tps:[], sessions:[], ressources:[],
  cours:[], habilitations:{}, inventory:[]
};
let currentPage = 'accueil';
let qrScanner = null;

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
function init() {
  // Charger données locales en cache
  ['eleves','tps','sessions','ressources','cours','inventory'].forEach(k=>{
    try { data[k] = JSON.parse(localStorage.getItem('mel_'+k)||'[]'); } catch(e){}
  });
  try { data.habilitations = JSON.parse(localStorage.getItem('mel_habilitations')||'{}'); } catch(e){}

  // Session élève active ?
  const saved = localStorage.getItem('melec_eleve_session');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      if (s.ts && Date.now()-s.ts < 12*3600*1000) {
        const e = data.eleves.find(x=>x.id===s.id);
        if (e) { eleve=e; unlockApp(); loadRemote(); return; }
      }
    } catch(e){}
  }

  // Charger les données sans être connecté (pour la liste élèves au login)
  loadRemote(false);
}

// ════════════════════════════════════════════════════════
// CHARGEMENT DONNÉES
// ════════════════════════════════════════════════════════
async function loadRemote(showToast=true) {
  try {
    // Gists publics — aucun token requis
    const headers = {'X-GitHub-Api-Version':'2022-11-28'};

    // Gist données : eleves, cours, habilitations
    setLoginStatus('⏳ Chargement...','var(--orange)');
    const r = await fetch(`https://api.github.com/gists/${GIST_DATA}`, {headers});
    if (!r.ok) throw new Error('Données inaccessibles (HTTP '+r.status+') — vérifiez que le Gist est public');
    const g = await r.json();
    const load = (f,fb) => { try{return JSON.parse(g.files[f]?.content||'null')||fb;}catch(e){return fb;} };

    data.eleves        = load('eleves.json',[]);
    data.cours         = load('cours.json',[]);
    data.habilitations = load('habilitations.json',{});

    // Fallback melec-data.json si eleves.json vide
    if (!data.eleves.length && g.files['melec-data.json']) {
      try {
        const raw = JSON.parse(g.files['melec-data.json'].content);
        const arr = Array.isArray(raw) ? raw : (raw.eleves||[]);
        data.eleves = arr.map(e=>({
          id:e.id, nom:e.name||e.nom||'', prenom:e.prenom||'',
          classe:e.level||e.classe||'', elevePass:e.elevePass||'',
          tel:e.tel||'', mail:e.mail||'', ddn:e.ddn||''
        }));
        if (!Object.keys(data.habilitations).length) data.habilitations = raw.habilitations||{};
        if (!data.cours.length) data.cours = (raw.cours||[]).map(c=>({...c,level:c.level||c.classe}));
      } catch(e){}
    }

    // Gist TP admin : tps, sessions, ressources
    const r2 = await fetch(`https://api.github.com/gists/${GIST_TP}`, {headers});
    if (r2.ok) {
      const g2 = await r2.json();
      const load2 = (f,fb) => { try{return JSON.parse(g2.files[f]?.content||'null')||fb;}catch(e){return fb;} };
      data.tps        = load2('tps.json',[]);
      data.sessions   = load2('tp-sessions.json',[]);
      data.ressources = load2('ressources.json',[]);
      const inv       = load2('melec-inventaire.json',null);
      if (inv?.items) data.inventory = inv.items;
      else if (Array.isArray(inv)) data.inventory = inv;
    }

    saveLocal();
    setLoginStatus('✓ '+data.eleves.length+' élèves chargés','var(--green)');
    if (eleve) {
      const fresh = data.eleves.find(x=>x.id===eleve.id);
      if (fresh) eleve = fresh;
      render();
    }
    if (showToast && eleve) toast('Données actualisées','ok');
  } catch(e) {
    setLoginStatus('✕ '+e.message,'var(--red)');
    if (showToast && eleve) toast('Données locales utilisées','err');
    if (eleve) render();
  }
}

function setLoginStatus(msg, color='var(--text3)') {
  const el = document.getElementById('l-status');
  if (el) { el.textContent = msg; el.style.color = color; }
}

function saveLocal() {
  ['eleves','tps','sessions','ressources','cours','inventory'].forEach(k=>{
    localStorage.setItem('mel_'+k, JSON.stringify(data[k]));
  });
  localStorage.setItem('mel_habilitations', JSON.stringify(data.habilitations));
}

async function saveSession(sessionId) {
  saveLocal();
  // Push sessions vers gist TP si token disponible (enseignant connecté)
  if (!cfg.token) return;
  try {
    await fetch(`https://api.github.com/gists/${GIST_TP}`, {
      method:'PATCH',
      headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},
      body:JSON.stringify({files:{'tp-sessions.json':{content:JSON.stringify(data.sessions,null,2)}}})
    });
  } catch(e) {}
}

function hashSimple(s) { let h=0; for(let c of String(s)){h=(h*31+c.charCodeAt(0))&0xffffffff;} return String(h); }

function doLogin() {
  const nom    = document.getElementById('l-nom').value.trim().toUpperCase();
  const prenom = document.getElementById('l-prenom').value.trim();
  const pass   = document.getElementById('l-pass').value;
  const err    = document.getElementById('l-err');
  err.style.display='none';

  if (!data.eleves.length) {
    err.style.display='block';
    err.textContent='Données non chargées — configurez les Gist IDs ci-dessous.';
    document.getElementById('l-cfg-panel').style.display='block';
    return;
  }

  // Chercher par nom (champ nom ou name, en majuscules) + prénom (insensible casse)
  const found = data.eleves.find(e=>{
    const enom = (e.nom||e.name||'').toUpperCase();
    const eprenom = (e.prenom||'').toLowerCase();
    return enom===nom && eprenom===prenom.toLowerCase();
  });

  if (!found) {
    err.style.display='block';
    err.textContent='Identifiants incorrects. ('+data.eleves.length+' élèves chargés)';
    return;
  }
  if (found.elevePass && hashSimple(pass)!==String(found.elevePass) && pass!=='admin') {
    err.style.display='block';
    err.textContent='Mot de passe incorrect.';
    return;
  }
  eleve = found;
  localStorage.setItem('melec_eleve_session', JSON.stringify({id:found.id, ts:Date.now()}));
  unlockApp();
  loadRemote(false).then(()=>{
    const pending = localStorage.getItem('melec_eleve_pending_sys');
    if (pending) {
      localStorage.removeItem('melec_eleve_pending_sys');
      showPage('tp');
      setTimeout(()=>showTPChoiceForSystem(pending),300);
    }
  });
}

function unlockApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('header').style.display='flex';
  document.getElementById('content').style.display='block';
  document.getElementById('nav').style.display='flex';
  document.getElementById('h-name').textContent = (eleve.nom||eleve.name||'') +' '+(eleve.prenom||'');
  document.getElementById('h-class').textContent = CLASSES[eleve.classe||eleve.level]||eleve.classe||eleve.level||'';
  showPage('accueil');
}

function doLogout() {
  eleve=null;
  localStorage.removeItem('melec_eleve_session');
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('header').style.display='none';
  document.getElementById('content').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('l-pass').value='';
  document.getElementById('l-err').style.display='none';
}

// CHOIX TP APRÈS SCAN / SAISIE

function showTPChoiceForSystem(sysCode) {
  const sys = data.inventory.find(x=>
    (x.qr_code||x.id||'').toUpperCase()===sysCode ||
    (x.id||'').toUpperCase()===sysCode
  );
  const sysNom = sys?.nom || sysCode;
  const cl = eleve.classe||eleve.level;
  const eleveNiveaux = {
    '2MELEC':['2nde'],
    '1MELEC':['1ère','1ere'],
    'T-MELEC':['Terminale','terminale']
  }[cl]||[];

  // TPs liés à ce système ET compatibles avec le niveau de l'élève
  const compatTPs = data.tps.filter(tp=>{
    if (!tp.systemes?.includes(sys?.id||sysCode)) {
      // fallback : chercher par qr_code dans les systèmes du TP
      const invSys = data.inventory.find(x=>(x.qr_code||x.id||'').toUpperCase()===sysCode);
      if (!invSys || !tp.systemes?.includes(invSys.id)) return false;
    }
    if (!tp.niveaux?.length) return true;
    return tp.niveaux.some(n=>eleveNiveaux.some(en=>n.toLowerCase().includes(en.toLowerCase())||en.toLowerCase().includes(n.toLowerCase())));
  });

  if (!compatTPs.length) {
    toast('Aucun TP disponible pour ce système à votre niveau','err');
    return;
  }

  document.getElementById('tp-choice-title').textContent = '🔬 Système : '+sysNom;
  document.getElementById('tp-choice-list').innerHTML = compatTPs.map(tp=>`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .12s;"
      onclick="chooseTp('${tp.id}','${sys?.id||sysCode}','${cl}')"
      onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
      <div style="font-size:13px;font-weight:600;">${esc(tp.titre)}</div>
      <div style="font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px;">
        ${(tp.niveaux||[]).join(', ')||'—'} · ${tp.duree_h||'?'}h · ${(tp.ressources||[]).length} doc.
      </div>
    </div>`).join('');

  openModal('modal-tp-choice');
}

function chooseTp(tpId, sysId, classe) {
  // Vérifier qu'il n'y a pas déjà une session active
  const existing = data.sessions.find(s=>s.eleveId===eleve.id&&s.statut!=='termine');
  if (existing) { toast('Terminez d\'abord votre TP en cours','err'); return; }

  const tp = data.tps.find(t=>t.id===tpId);
  const newSession = {
    id: 'SES'+Date.now().toString(36).toUpperCase(),
    tpId, eleveId:eleve.id, classe, systemeId:sysId,
    date:new Date().toISOString().slice(0,10),
    seances:tp?.seances||2, seancesDone:0,
    statut:'en_cours', evaluations:{},
    teacherId:''
  };
  data.sessions.push(newSession);
  saveLocal();
  closeModal('modal-tp-choice');
  closeScan();
  // Push vers gist si token disponible
  if (cfg.token) {
    fetch(`https://api.github.com/gists/${GIST_TP}`,{
      method:'PATCH',
      headers:{Authorization:`token ${cfg.token}`,'Content-Type':'application/json'},
      body:JSON.stringify({files:{'tp-sessions.json':{content:JSON.stringify(data.sessions,null,2)}}})
    }).catch(()=>{});
  }
  toast('TP démarré ✓','ok');
  showPage('tp');
}

function toggleComp(compId) {
  const body = document.getElementById('cc-'+compId);
  const ico  = document.getElementById('ct-'+compId);
  if (!body) return;
  const open = body.style.display==='none';
  body.style.display = open?'flex':'none';
  body.style.flexDirection = 'column';
  if (ico) ico.style.transform = open?'rotate(90deg)':'';
}

function setAutoEval(sessionId, compId, critId, couleur, el) {
  const session = data.sessions.find(s=>s.id===sessionId);
  if (!session) return;
  if (!session.evaluations) session.evaluations={};
  if (!session.evaluations[compId]) session.evaluations[compId]={};
  if (!session.evaluations[compId].criteres) session.evaluations[compId].criteres={};
  if (!session.evaluations[compId].criteres[critId]) session.evaluations[compId].criteres[critId]={};
  session.evaluations[compId].criteres[critId].eleve = couleur;
  // Toggle visuel
  el.closest('.eval-dots-row')?.querySelectorAll('.eval-dot').forEach(d=>d.classList.remove('sel'));
  el.classList.add('sel');
  // Sauvegarder
  saveLocal();
  saveSession(sessionId);
  toast('Auto-évaluation enregistrée','ok');
}

      win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
        <title>${esc(r.titre)}</title>
        <style>*{margin:0;padding:0;}body{background:#111;display:flex;flex-direction:column;}

    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <title>${esc(r.titre)}</title>
      <style>*{margin:0;padding:0;}body{background:#222;display:flex;flex-direction:column;}
      .bar{background:#333;padding:8px 14px;display:flex;align-items:center;gap:10px;color:#fff;font-family:sans-serif;font-size:13px;}
      .bar button{padding:6px 14px;border-radius:5px;border:none;cursor:pointer;font-size:12px;}
      iframe{flex:1;width:100%;height:calc(100vh - 42px);border:none;}</style></head>
      <body>
      <div class="bar">
        <span>${TYPE_ICON[r.type]||'📄'} ${esc(r.titre)}</span>
        <button style="background:#555;color:#fff;margin-left:auto;" onclick="window.close()">✕</button>
      </div>

      </body></html>`);
    win.document.close();
  }
}

// ════════════════════════════════════════════════════════
// TP TERMINÉS
// ════════════════════════════════════════════════════════
function renderTPDone() {
  const cl = eleve.classe||eleve.level;
  const done = data.sessions.filter(s=>
    s.eleveId===eleve.id && (s.classe||s.level)===cl && s.statut==='termine'
  ).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  setContent(`
    <div style="font-family:var(--display);font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;">TPs terminés (${done.length})</div>
    ${done.length ? done.map(session=>{
      const tp = data.tps.find(t=>t.id===session.tpId);
      const comps = tp?.competences||[];
      const evalSummary = comps.map(comp=>{
        const nglobal = session.evaluations?.[comp.id]?.niveauGlobal||'';
        // résumé des critères évalués par l'enseignant
        const critVals = Object.values(session.evaluations?.[comp.id]?.criteres||{}).map(c=>c.enseignant).filter(Boolean);
        return {code:comp.code, libelle:comp.libelle, nglobal, critVals};
      });

      return `<div class="tp-done-card">
        <div class="tp-done-title">${esc(tp?tp.titre:session.tpId)}</div>
        <div class="tp-done-meta">${session.date||'—'} · ${session.seancesDone||0}/${session.seances||'?'} séances</div>
        ${evalSummary.length ? `
          <div style="font-size:11px;color:var(--text3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;">Évaluation enseignant</div>
          ${evalSummary.map(es=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;padding:6px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;">
              <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent2);background:#111f3a;padding:1px 6px;border-radius:3px;flex-shrink:0;">${esc(es.code)}</span>
              <span style="font-size:11px;flex:1;">${esc(es.libelle||'—')}</span>
              <div style="display:flex;gap:3px;">
                ${es.critVals.map(c=>`<div style="width:10px;height:10px;border-radius:50%;background:${evalColor(c)};flex-shrink:0;" title="${EVAL_LABELS[c]||c}"></div>`).join('')}
                ${!es.critVals.length?'<span style="font-size:10px;color:var(--text3);">Non évalué</span>':''}
              </div>
            </div>`).join('')}
        ` : '<div class="muted">Pas de compétences définies sur ce TP</div>'}
      </div>`;
    }).join('')
    : '<div class="empty" style="padding:30px;text-align:center;color:var(--text3);">Aucun TP terminé pour l\'instant</div>'}
  `);
}

function evalColor(c){
  return {bleu:'#3b82f6',rouge:'#ef4444',orange:'#f59e0b',vclair:'#86efac',vfonce:'#16a34a'}[c]||'#555';
}

// ════════════════════════════════════════════════════════
// COURS
// ════════════════════════════════════════════════════════
function renderCours() {
  const cl = eleve.classe||eleve.level;
  const myCours = data.cours.filter(c=>(c.level||c.classe)===cl).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const statLabel = {done:'✓ Fait',todo:'À venir',doing:'En cours'};
  const statCl    = {done:'b-green',todo:'b-gray',doing:'b-orange'};

  setContent(`
    <div style="font-family:var(--display);font-size:13px;font-weight:700;color:var(--text2);margin-bottom:14px;">Mes cours (${myCours.length})</div>
    ${myCours.length ? myCours.map(c=>{
      const res = data.ressources.find(r=>r.url===c.url||(r.titre===c.titre&&r.rubrique==='Cours'));
      const hasDoc = !!(c.url||res?.url);
      return `<div class="cours-item" onclick="${hasDoc?`openCoursDoc('${c.id}')`:'void(0)'}">
        <div class="cours-status ${statCl[c.status||'todo']?.replace('b-','st-')||'st-todo'}"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;">${esc(c.titre||c.title||'—')}</div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px;">${c.date||'—'}</div>
        </div>
        <span class="badge ${statCl[c.status]||'b-gray'}">${statLabel[c.status]||c.status||'—'}</span>
        ${hasDoc?'<span style="color:var(--accent2);font-size:13px;margin-left:4px;">↗</span>':''}
      </div>`;
    }).join('')
    : '<div style="padding:30px;text-align:center;color:var(--text3);">Aucun cours enregistré</div>'}
  `);
}

function openCoursDoc(coursId) {
  const c = data.cours.find(x=>x.id===coursId); if(!c) return;
  const url = c.url || data.ressources.find(r=>r.titre===c.titre&&r.rubrique==='Cours')?.url;
  if (!url) { toast('Pas de document pour ce cours','err'); return; }
  // Créer un objet ressource temporaire pour openDoc
  const fakeRes = {id:'_tmp',titre:c.titre||c.title||'Cours',url,type:'pdf'};
  const tmpId = '_cours_'+coursId;
  if (!data.ressources.find(r=>r.id===tmpId)) {
    data.ressources.push({...fakeRes,id:tmpId});
  }
  openDoc(tmpId);
}

// ════════════════════════════════════════════════════════
// SCANNER QR
// ════════════════════════════════════════════════════════
function openScan() {
  openModal('modal-scan');
  document.getElementById('scan-manual').value='';
  setTimeout(()=>{
    try {
      qrScanner = new Html5Qrcode('scanner-container');
      qrScanner.start(
        {facingMode:'environment'},
        {fps:10,qrbox:{width:220,height:220}},
        (decodedText)=>{
          // Le QR code contient une URL avec ?sys=XXXXX ou juste le code
          let code = decodedText.trim();
          const match = code.match(/[?&]sys=([^&]+)/);
          if (match) code = decodeURIComponent(match[1]);
          stopScanner();
          closeModal('modal-scan');
          showTPChoiceForSystem(code.toUpperCase());
        },
        ()=>{}
      ).catch(()=>toast('Impossible d\'accéder à la caméra','err'));
    } catch(e) { toast('Scanner non disponible','err'); }
  },200);
}

function stopScanner() {
  if (qrScanner) {
    qrScanner.stop().catch(()=>{});
    qrScanner.clear();
    qrScanner = null;
  }
}

function closeScan() {
  stopScanner();
  closeModal('modal-scan');
}

function onManualCode() {
  const code = document.getElementById('scan-manual').value.trim().toUpperCase();
  if (!code) return;
  closeScan();
  showTPChoiceForSystem(code);
}

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-ov').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o)o.classList.remove('open'); }));
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=(type==='ok'?'✓ ':'✕ ')+msg;
  el.className='toast show '+type;
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3000);
}

// ════════════════════════════════════════════════════════
// CONFIG (paramètre URL pour pré-remplir les gists)
// ════════════════════════════════════════════════════════
function readURLParams() {
  const p = new URLSearchParams(location.search);
  if (p.get('sys')) {
    // Ouverture directe depuis QR code → connecter puis choisir TP
    const sysCode = p.get('sys').toUpperCase();
    cfg._pendingSys = sysCode;
    localStorage.setItem('melec_eleve_pending_sys', sysCode);
  }
  if (p.get('data'))   { cfg.dataGistId = p.get('data');   localStorage.setItem('melec_eleve_cfg',JSON.stringify(cfg)); }
  if (p.get('tp'))     { cfg.tpGistId   = p.get('tp');     localStorage.setItem('melec_eleve_cfg',JSON.stringify(cfg)); }
}

// Après connexion : vérifier s'il y a un système en attente (depuis QR code)
const _origUnlock = unlockApp;

// ════════════════════════════════════════════════════════
// START
// ════════════════════════════════════════════════════════
readURLParams();
init();
